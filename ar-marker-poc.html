<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ARマーカー認識PoC（発電機・準本番）</title>

<!-- ══════════════════════════════════════════════════════════════
  ARマーカー方式（AR.js）準本番PoC ／ 対象：発電機シナリオのみ
  ・既存環境（ar-auto-manual.html 等）には一切影響しない独立ファイル
  ・A-Frame と AR.js は CDN から個別に読み込む
  ・v0.2：発電機の全指示オブジェクト（box/arrow/arrowDown/curvedArrow/ring/text）を
          マーカー座標系に載せ替え。ステップ送りで表示切替。
  マーカー：既定=Hiro。 ?marker=barcode&value=0 でバーコード(matrix3x3)に切替
  校正用パラメータ： ?scale=3（大きさ） ?rot=0|90|180|270（マーカー上での向き）
═══════════════════════════════════════════════════════════════ -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:-apple-system,'Helvetica Neue',sans-serif; }
  .a-enter-vr, .a-orientation-modal { display:none !important; }

  #ui { position:fixed; inset:0; pointer-events:none; z-index:10; }

  #topbar {
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    background:rgba(255,255,255,0.92); backdrop-filter:blur(8px);
    box-shadow:0 1px 6px rgba(0,0,0,0.12);
  }
  #title { font-size:14px; font-weight:700; color:#1e293b; flex:1; line-height:1.3; }
  #title small { display:block; font-size:10px; font-weight:500; color:#64748b; }
  #ver { font-size:10px; font-weight:700; color:#7c3aed; background:rgba(124,58,237,0.12); padding:2px 7px; border-radius:8px; }

  #status {
    position:absolute; top:58px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:8px;
    background:rgba(0,0,0,0.62); color:#fff; padding:7px 14px; border-radius:20px;
    font-size:12px; font-weight:600; white-space:nowrap;
  }
  #dot { width:10px; height:10px; border-radius:50%; background:#f59e0b; transition:background .2s; }
  #dot.on { background:#22c55e; box-shadow:0 0 8px #22c55e; }

  #hint {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.55); color:#fff; padding:16px 22px; border-radius:16px;
    text-align:center; font-size:14px; font-weight:600; line-height:1.6; max-width:80%;
  }
  #hint.hidden { display:none; }
  #hint small { display:block; margin-top:6px; font-size:11px; font-weight:500; color:#cbd5e1; }

  #metrics {
    position:absolute; top:58px; right:12px;
    background:rgba(255,255,255,0.9); backdrop-filter:blur(6px);
    border-radius:12px; padding:8px 11px; font-size:11px; color:#334155; line-height:1.7;
    box-shadow:0 2px 8px rgba(0,0,0,.1); pointer-events:auto;
  }
  #metrics b { color:#0f172a; }
  #metrics button { margin-top:5px; width:100%; padding:5px 8px; border:1px solid #cbd5e1; border-radius:8px; background:#fff; color:#334155; font-size:11px; font-weight:600; cursor:pointer; }

  #card {
    position:absolute; left:12px; right:12px; bottom:14px;
    background:rgba(255,255,255,0.96); backdrop-filter:blur(10px);
    border-radius:16px; padding:14px 16px; box-shadow:0 6px 20px rgba(0,0,0,0.18); pointer-events:auto;
  }
  #card-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  #badge { padding:3px 10px; border-radius:12px; font-size:11px; font-weight:700; color:#fff; }
  #stitle { font-size:15px; font-weight:700; color:#1e293b; flex:1; line-height:1.3; }
  #sdetail { font-size:12.5px; color:#475569; line-height:1.6; white-space:pre-line; margin-bottom:12px; }
  #nav { display:flex; gap:8px; }
  #nav button { flex:1; padding:12px 0; border:none; border-radius:12px; font-size:14px; font-weight:700; color:#fff; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  #btn-prev { background:rgba(0,0,0,0.18); color:#1e293b; }
  #btn-next { background:#1d4ed8; }
  #counter { text-align:center; font-size:11px; color:#64748b; margin-top:8px; }
  .cbtn { width:34px; height:30px; border:1px solid #cbd5e1; border-radius:8px; background:#fff; font-weight:700; color:#334155; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .cbtn:active { background:#e0e7ff; }
</style>
</head>
<body>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; precision: medium;"
  arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; patternRatio: 0.5; debugUIEnabled: false;">
  <!-- マーカーと追従コンテンツは静的に配置（動的生成だとAR.js初期化で子が外れるため）。
       マーカー種別・校正値は起動時にJSで属性を上書きする。 -->
  <a-marker id="marker" preset="hiro"
    smooth="true" smoothCount="8" smoothTolerance="0.01" smoothThreshold="4">
    <a-entity id="wrapper" position="0 0.01 0">
      <a-entity id="content" rotation="-90 0 0"></a-entity>
    </a-entity>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>

<div id="ui">
  <div id="topbar">
    <div id="title">発電機 ｜ ARマーカー準本番PoC<small id="markerinfo"></small></div>
    <div id="ver">PoC v0.8</div>
  </div>

  <div id="status"><span id="dot"></span><span id="stxt">マーカー未認識</span></div>

  <div id="metrics">
    カメラ: <b id="m-cam">起動待ち…</b><br>
    認識回数: <b id="m-count">0</b><br>
    再認識時間: <b id="m-reacq">–</b><br>
    <button id="btn-reset">計測リセット</button>
  </div>

  <div id="hint">マーカーにカメラを向けてください<small id="hint-sub"></small></div>

  <button id="cal-toggle" style="position:absolute;left:12px;top:96px;pointer-events:auto;background:rgba(15,23,42,0.82);color:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer">校正</button>
  <div id="calib" style="position:absolute;left:12px;top:134px;pointer-events:auto;display:none;background:rgba(255,255,255,0.97);backdrop-filter:blur(8px);border-radius:12px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.2);font-size:12px;color:#1e293b;min-width:186px">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><span style="width:36px">サイズ</span><button class="cbtn" data-cal="s-">－</button><b id="cal-s" style="flex:1;text-align:center">1.00</b><button class="cbtn" data-cal="s+">＋</button></div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><span style="width:36px">左右</span><button class="cbtn" data-cal="x-">←</button><b id="cal-x" style="flex:1;text-align:center">0.0</b><button class="cbtn" data-cal="x+">→</button></div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><span style="width:36px">上下</span><button class="cbtn" data-cal="y-">↓</button><b id="cal-y" style="flex:1;text-align:center">0.0</b><button class="cbtn" data-cal="y+">↑</button></div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px"><span style="width:36px">回転</span><button class="cbtn" data-cal="r" style="flex:1;width:auto">90°回す</button><b id="cal-r" style="width:36px;text-align:center">0</b></div>
    <button id="cal-copy" style="width:100%;padding:8px;border:none;border-radius:9px;background:#1d4ed8;color:#fff;font-weight:700;font-size:12px;cursor:pointer">校正値をコピー</button>
    <div id="cal-msg" style="font-size:10px;color:#475569;margin-top:6px;line-height:1.5;word-break:break-all"></div>
  </div>

  <div id="card">
    <div id="card-head">
      <span id="badge">STEP</span>
      <span id="stitle">–</span>
    </div>
    <div id="sdetail">–</div>
    <div id="nav">
      <button id="btn-prev">‹ 戻る</button>
      <button id="btn-next">次へ ›</button>
    </div>
    <div id="counter">– / –</div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
// 発電機シナリオ ／ 座標=Gマーカー中心を原点とした実寸（1単位=50mm, x:右+ y:上+）
// 位置は現物写真からの実測「見積り」。実機で ?ox= ?oy= ?scale= で微調整する前提。
//   右下Gマーカーから見た各操作部の相対位置：
//   つまみ左(-4.42,7.10) 右(-2.95,7.10) / 上部LED 青(-1.63,7.26)黄(-0.84,7.32)赤(0,7.26)
//   白ボタン(-3.05,4.16) 青ボタン(-1.63,4.16) / 下部レバー 左(-3.89,1.47)中(-2.32,1.47)右(-0.74,1.47)
// ══════════════════════════════════════════
const STEPS = [
  { title:'ランプ点灯色の確認', warn:'caution',
    detail:'盤面右上のランプを確認してください。\n点灯している色のボタンを押してください。',
    ar:[ { type:'box', pos:[-0.84,7.30,0], color:'#ef4444', sizeW:2.4, sizeH:1.1, label:'ランプ点灯色を確認', labelBelow:true, textColor:'#fff', textBg:'#ef4444' } ] },
  { title:'つまみを左右に回す', warn:'normal',
    detail:'左側のつまみを左へ30、右側のつまみを右へ70回してください。',
    ar:[ {type:'curvedArrow', pos:[-4.42,7.10,0], color:'#60a5fa', dir:'left',  label:'左へ回す\n30', size:1.0},
         {type:'curvedArrow', pos:[-2.95,7.10,0], color:'#60a5fa', dir:'right', label:'右へ回す\n70', size:1.0} ] },
  { title:'ボタンを1回ずつ押す', warn:'normal',
    detail:'中央左・中央のボタンをそれぞれ1回押してください。',
    ar:[ {type:'ring', pos:[-3.05,4.16,0], color:'#60a5fa', size:0.85, label:'1回押す'},
         {type:'ring', pos:[-1.63,4.16,0], color:'#60a5fa', size:0.85, label:'1回押す'} ] },
  { title:'レバーを操作する', warn:'caution',
    detail:'左下レバーを上に、右下レバーを下に押してください。',
    ar:[ {type:'arrow',     pos:[-3.89,1.47,0], color:'#60a5fa', h:0.9, label:'上に押す', labelAbove:true},
         {type:'arrowDown', pos:[-0.74,1.47,0], color:'#60a5fa', h:0.9, label:'下に押す'} ] },
  { title:'青ランプの点灯確認', warn:'normal',
    detail:'中央のランプが青色に点灯したことを確認して作業完了です。',
    ar:[ {type:'box', pos:[-1.63,7.26,0], color:'#3b82f6', size:0.8, label:'青の点灯を確認', labelBelow:true, textColor:'#3b82f6', textBg:'#facc15'} ] },
];
const WARN = { normal:{c:'#1d4ed8',label:'通常'}, caution:{c:'#d97706',label:'注意'}, danger:{c:'#dc2626',label:'危険'} };

// ══════════════════════════════════════════
// パラメータ（マーカー種別・校正）
// ══════════════════════════════════════════
const params = new URLSearchParams(location.search);
// marker= barcode（既定）/ hiro / pattern
const markerMode  = ['barcode','hiro','pattern'].includes(params.get('marker')) ? params.get('marker') : 'barcode';
const barcodeValue = params.get('value') || '0';
const pattUrl = params.get('patt') || 'markers/G.patt'; // pattern時に読み込む学習ファイル
// 座標系：1単位 = マーカー1辺 = 50mm。原点=マーカー中心。x:右+ / y:上+
let S   = parseFloat(params.get('scale') || '1');   // 全体倍率（校正で調整）
let ROT = parseFloat(params.get('rot')   || '0');   // マーカー上での向き（校正）
let offX = parseFloat(params.get('ox') || '0');     // 全体オフセットX（単位, 校正）
let offY = parseFloat(params.get('oy') || '0');     // 全体オフセットY（単位, 校正）
// 表示向き： marker=マーカー面と同一平面（既定・実パネル貼付向け）
//           camera=常にカメラを向く（机上テストで傾いて見える時に）
const faceMode = params.get('face') === 'camera' ? 'camera' : 'marker';

// ビルボード：エンティティを毎フレーム カメラ正面へ向ける
AFRAME.registerComponent('billboard', {
  tick: function () {
    const cam = this.el.sceneEl && this.el.sceneEl.camera;
    if (!cam) return;
    cam.getWorldPosition(this._v || (this._v = new THREE.Vector3()));
    this.el.object3D.lookAt(this._v);
  }
});

// ══════════════════════════════════════════
// マーカーと追従コンテンツ（静的要素の属性を上書き）
// ══════════════════════════════════════════
const scene   = document.querySelector('a-scene');
const marker  = document.getElementById('marker');
const wrapper = document.getElementById('wrapper');
const content = document.getElementById('content');

// マーカー種別（既定Hiro→バーコード / カスタムパターンへ切替）
if (markerMode === 'barcode') {
  marker.removeAttribute('preset');
  marker.setAttribute('type', 'barcode');
  marker.setAttribute('value', barcodeValue);
} else if (markerMode === 'pattern') {
  marker.removeAttribute('preset');
  marker.setAttribute('type', 'pattern');
  marker.setAttribute('url', pattUrl);
}
// 倍率
wrapper.setAttribute('scale', `${S} ${S} ${S}`);
// 表示向き
if (faceMode === 'marker') {
  // マーカー面と同一平面（縦パネル貼付向け）。従来通り寝かせて外向きに。
  wrapper.setAttribute('rotation', `0 ${ROT} 0`);
  content.setAttribute('rotation', '-90 0 0');
} else {
  // 常にカメラを向く：content自身をビルボード。寝かせない（rotation 0）
  wrapper.setAttribute('rotation', '0 0 0');
  content.setAttribute('rotation', '0 0 0');
  content.setAttribute('billboard', '');
}

const markerLabel =
  markerMode === 'barcode' ? `バーコード(matrix 3x3) value=${barcodeValue}` :
  markerMode === 'pattern' ? `カスタムパターン(${pattUrl})` : 'Hiroマーカー';
document.getElementById('markerinfo').textContent = `${markerLabel} ／ scale=${S} rot=${ROT}`;
document.getElementById('hint-sub').textContent =
  markerMode === 'barcode' ? 'バーコードマーカー(3x3,value='+barcodeValue+')を印刷' :
  markerMode === 'pattern' ? '生成したパターンマーカーを印刷' : 'Hiroマーカーを印刷して使用';

// ══════════════════════════════════════════
// 指示オブジェクト → canvasテクスチャの a-plane に変換
//   元の pos(x,y) を content(rotation -90) の子として配置すれば、
//   マーカー面に貼り付いた状態で表示される。PXREF: 1authored単位=1000px
// ══════════════════════════════════════════
const PXREF = 1000;
function planeFromCanvas(cv, x, y, z) {
  const el = document.createElement('a-plane');
  el.setAttribute('width',  (cv.width  / PXREF).toFixed(4));
  el.setAttribute('height', (cv.height / PXREF).toFixed(4));
  el.setAttribute('position', `${x} ${y} ${z||0}`);
  el.setAttribute('material', { shader:'flat', transparent:true, side:'double', src: cv.toDataURL('image/png') });
  return el;
}
function labelMetrics(ctx, text, fontPx) {
  ctx.font = `bold ${fontPx}px sans-serif`;
  const lines = String(text).split('\n');
  let w = 0; lines.forEach(l => w = Math.max(w, ctx.measureText(l).width));
  const lh = fontPx * 1.25;
  return { lines, w, lh, h: lines.length * lh };
}
function drawLabel(ctx, cx, cy, text, fontPx, bg, fg) {
  const m = labelMetrics(ctx, text, fontPx);
  const padX = 26, padY = 16;
  const w = m.w + padX*2, h = m.h + padY*2;
  const x = cx - w/2, y = cy - h/2, r = Math.min(28, h/2);
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill();
  ctx.fillStyle = fg; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font = `bold ${fontPx}px sans-serif`;
  m.lines.forEach((l,i) => ctx.fillText(l, cx, cy - m.h/2 + m.lh*(i+0.5)));
  return { w, h };
}
// 各アイコン描画（中心 cx,cy）
function iconArrow(ctx, cx, cy, w, h, color, dir){
  ctx.save(); ctx.translate(cx,cy); if(dir==='up') ctx.scale(1,-1); // 既定は下向き、upで反転
  ctx.fillStyle=color; ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=6; ctx.lineJoin='round';
  const shaftW=w*0.34;
  ctx.beginPath();
  ctx.moveTo(-shaftW/2,-h/2); ctx.lineTo(shaftW/2,-h/2); ctx.lineTo(shaftW/2,h*0.05);
  ctx.lineTo(w/2,h*0.05); ctx.lineTo(0,h/2); ctx.lineTo(-w/2,h*0.05); ctx.lineTo(-shaftW/2,h*0.05);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function iconRing(ctx, cx, cy, r, color){
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.lineWidth=Math.max(10,r*0.28); ctx.strokeStyle=color; ctx.stroke();
  ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,0.30)';
  ctx.beginPath(); ctx.arc(cx,cy,r+ctx.lineWidth,0,Math.PI*2); ctx.stroke();
}
function iconBox(ctx, cx, cy, w, h, color, thickPx){
  ctx.lineWidth=thickPx||14; ctx.strokeStyle=color; ctx.lineJoin='round';
  const r=Math.min(24,h/2), x=cx-w/2, y=cy-h/2;
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.stroke();
}
function iconCurved(ctx, cx, cy, r, color, dir){
  ctx.save(); ctx.translate(cx,cy); if(dir==='left') ctx.scale(-1,1);
  ctx.strokeStyle=color; ctx.lineWidth=Math.max(12,r*0.26); ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,0,r, Math.PI*0.85, Math.PI*0.15, false); ctx.stroke();
  // 矢じり（弧の終点付近）
  const a=Math.PI*0.15, ex=r*Math.cos(a), ey=r*Math.sin(a), hs=r*0.5;
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.moveTo(ex,ey);
  ctx.lineTo(ex-hs*0.2, ey-hs); ctx.lineTo(ex+hs*0.7, ey-hs*0.35); ctx.closePath(); ctx.fill();
  ctx.restore();
}
// アイテム1個 → a-plane
function makeItem(it){
  const tmp = document.createElement('canvas').getContext('2d');
  const color = it.color || '#60a5fa';
  const labelFont = 46;
  const bg = it.textBg || 'rgba(0,0,0,0.82)';
  const fg = it.textColor || '#ffffff';
  const lm = it.label ? labelMetrics(tmp, it.label, labelFont) : null;
  const labelW = lm ? lm.w + 52 : 0;
  const labelH = lm ? lm.h + 32 : 0;

  // アイコン寸法(px)。サイズは単位(1=50mm)指定
  let iw=0, ih=0;
  if (it.type==='box')       { iw=(it.sizeW||it.size||0.5)*PXREF; ih=(it.sizeH||it.size||0.5)*PXREF; }
  else if (it.type==='ring') { iw=ih=(it.size||0.6)*PXREF; }
  else if (it.type==='arrow'||it.type==='arrowDown') { ih=(it.h||0.6)*PXREF; iw=ih*0.7; }
  else if (it.type==='curvedArrow') { iw=ih=(it.size||0.7)*PXREF; }
  else if (it.type==='text') { iw=0; ih=0; }

  const gap = 22;
  const labelAbove = !!it.labelAbove;
  const cw = Math.max(iw, labelW) + 30;
  const ch = (it.type==='text') ? (labelH+20) : (ih + 2*(gap+labelH) + 20);
  const cv = document.createElement('canvas'); cv.width=Math.ceil(cw); cv.height=Math.ceil(ch);
  const ctx = cv.getContext('2d');
  const CX = cw/2, CY = ch/2;

  // アイコン
  if (it.type==='box')            iconBox(ctx, CX, CY, iw, ih, color, (it.lineThick||0.03)*PXREF);
  else if (it.type==='ring')      iconRing(ctx, CX, CY, iw/2, color);
  else if (it.type==='arrow')     iconArrow(ctx, CX, CY, iw, ih, color, 'up');
  else if (it.type==='arrowDown') iconArrow(ctx, CX, CY, iw, ih, color, 'down');
  else if (it.type==='curvedArrow') iconCurved(ctx, CX, CY, iw/2, color, it.dir);

  // ラベル
  if (it.label) {
    if (it.type==='text') drawLabel(ctx, CX, CY, it.label, labelFont, bg, fg);
    else {
      const ly = labelAbove ? (CY - ih/2 - gap - labelH/2) : (CY + ih/2 + gap + labelH/2);
      drawLabel(ctx, CX, ly, it.label, labelFont, bg, fg);
    }
  }
  return planeFromCanvas(cv, it.pos[0]+offX, it.pos[1]+offY, it.pos[2]);
}

// ══════════════════════════════════════════
// ステップ描画
// ══════════════════════════════════════════
let idx = 0;
function renderStep(){
  const step = STEPS[idx];
  const col = WARN[step.warn].c;
  // 2D カード
  document.getElementById('stitle').textContent = step.title;
  document.getElementById('sdetail').textContent = step.detail;
  const badge=document.getElementById('badge'); badge.textContent=`STEP ${idx+1}`; badge.style.background=col;
  document.getElementById('btn-next').style.background=col;
  document.getElementById('counter').textContent=`${idx+1} / ${STEPS.length}`;
  document.getElementById('btn-prev').style.visibility = idx>0 ? 'visible':'hidden';
  document.getElementById('btn-next').style.visibility = idx<STEPS.length-1 ? 'visible':'hidden';
  // 3D 指示オブジェクト再構築
  while (content.firstChild) content.removeChild(content.firstChild);
  step.ar.forEach(it => content.appendChild(makeItem(it)));
}
document.getElementById('btn-next').onclick = () => { if (idx<STEPS.length-1){ idx++; renderStep(); } };
document.getElementById('btn-prev').onclick = () => { if (idx>0){ idx--; renderStep(); } };

// ══════════════════════════════════════════
// 認識イベント・計測
// ══════════════════════════════════════════
// 検出は毎フレーム揺らぐため、短時間のロストは無視して表示を維持する（デバウンス）。
// GRACE_MS 以内に再認識すれば「認識中」を保ち、ヒントの点滅を防ぐ。
const GRACE_MS = parseInt(params.get('grace') || '1000', 10);  // 見失い猶予（?grace=1500 等で調整可）
let count=0, lastLostAt=null, visible=false, lostTimer=null;
const dot=document.getElementById('dot'), stxt=document.getElementById('stxt'), hint=document.getElementById('hint');

function toFound(){
  if (visible) return;                 // すでに認識中なら何もしない（連続Found）
  visible = true;
  count++; document.getElementById('m-count').textContent = count;
  if (lastLostAt != null) document.getElementById('m-reacq').textContent = Math.round(performance.now()-lastLostAt)+' ms';
  dot.classList.add('on'); stxt.textContent='認識中'; hint.classList.add('hidden');
}
function toLost(){
  visible = false; lastLostAt = performance.now();
  dot.classList.remove('on'); stxt.textContent='マーカー未認識'; hint.classList.remove('hidden');
}
marker.addEventListener('markerFound', () => {
  if (lostTimer){ clearTimeout(lostTimer); lostTimer=null; }  // 猶予中の復帰＝ロスト扱いにしない
  toFound();
});
marker.addEventListener('markerLost', () => {
  if (lostTimer) clearTimeout(lostTimer);
  lostTimer = setTimeout(() => { lostTimer=null; toLost(); }, GRACE_MS); // 一定時間見失い続けた時だけロスト確定
});
document.getElementById('btn-reset').onclick = () => {
  count=0; lastLostAt=null;
  document.getElementById('m-count').textContent='0'; document.getElementById('m-reacq').textContent='–';
};

// カメラ状態の診断表示（映像が起動しているか・解像度）
const mcam = document.getElementById('m-cam');
setInterval(() => {
  const v = document.querySelector('video');
  if (!v) { mcam.textContent = '映像なし'; mcam.style.color = '#dc2626'; return; }
  if (v.videoWidth) { mcam.textContent = `${v.videoWidth}x${v.videoHeight}`; mcam.style.color = '#15803d'; }
  else { mcam.textContent = '起動中…'; mcam.style.color = '#d97706'; }
}, 800);
window.addEventListener('arjs-video-loaded', () => { mcam.textContent = '映像OK'; });

// ══════════════════════════════════════════
// 校正パネル（サイズ／左右／上下／回転 を実機で調整）
// ══════════════════════════════════════════
function applyCal(){
  wrapper.setAttribute('scale', `${S} ${S} ${S}`);
  if (faceMode==='marker') wrapper.setAttribute('rotation', `0 ${ROT} 0`);
  const g=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
  g('cal-s',S.toFixed(2)); g('cal-x',offX.toFixed(1)); g('cal-y',offY.toFixed(1)); g('cal-r',ROT);
  document.getElementById('markerinfo').textContent =
    `${markerLabel} ／ scale=${S.toFixed(2)} ox=${offX.toFixed(1)} oy=${offY.toFixed(1)} rot=${ROT}`;
  renderStep();
}
document.getElementById('cal-toggle').onclick = () => {
  const p=document.getElementById('calib');
  p.style.display = (p.style.display==='none' || !p.style.display) ? 'block' : 'none';
};
document.querySelectorAll('#calib .cbtn').forEach(b=>{
  b.onclick = () => {
    const k=b.getAttribute('data-cal');
    if      (k==='s+') S=Math.min(6, +(S+0.1).toFixed(2));
    else if (k==='s-') S=Math.max(0.2, +(S-0.1).toFixed(2));
    else if (k==='x+') offX=+(offX+0.2).toFixed(1);
    else if (k==='x-') offX=+(offX-0.2).toFixed(1);
    else if (k==='y+') offY=+(offY+0.2).toFixed(1);
    else if (k==='y-') offY=+(offY-0.2).toFixed(1);
    else if (k==='r')  ROT=(ROT+90)%360;
    applyCal();
  };
});
document.getElementById('cal-copy').onclick = () => {
  const url = `${location.origin}${location.pathname}?marker=${markerMode}`
    + (markerMode==='barcode' ? `&value=${barcodeValue}` : '')
    + `&scale=${S}&ox=${offX}&oy=${offY}&rot=${ROT}`;
  const msg=document.getElementById('cal-msg');
  const show=()=>{ msg.textContent='コピーしました ↓\n'+url; };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(show, ()=>{ msg.textContent=url; });
  } else { msg.textContent=url; }
};

applyCal();
</script>
