<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AR作業記録ナビ（バーコード）</title>
<!-- ════════════════════════════════════════════════════════════
  作業記録ナビ（バーコード版・AR.js）／ ar-manual-barcode を拡張した独立アプリ
  ・シナリオは GitHub barcode-scenarios/*.json（＋端末保存のローカル）から読込
  ・①チェック確認（各ステップを確認しないと次へ進めない）
  ・②作業ログ（端末内 IndexedDB に記録／CSV・JSON 書き出し）
  ・③「この機器を保存」＝シナリオ＋資料(PDF/動画)を端末保存し、ネット断でも再生
  ※ 既存の ar-manual-barcode / ar-barcode-editor は無改変
════════════════════════════════════════════════════════════ -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:-apple-system,'Helvetica Neue',sans-serif; }
  .a-enter-vr, .a-orientation-modal { display:none !important; }
  #ui { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #topbar { position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:10px;
    padding:10px 14px; background:rgba(255,255,255,0.92); backdrop-filter:blur(8px); box-shadow:0 1px 6px rgba(0,0,0,0.12); }
  #title { font-size:14px; font-weight:700; color:#1e293b; flex:1; line-height:1.3; }
  #title small { display:block; font-size:10px; font-weight:500; color:#64748b; }
  #ver { font-size:10px; font-weight:700; color:#0e7490; background:rgba(14,116,144,0.12); padding:2px 7px; border-radius:8px; }
  #status { position:absolute; top:58px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:8px;
    background:rgba(0,0,0,0.62); color:#fff; padding:7px 14px; border-radius:20px; font-size:12px; font-weight:600; white-space:nowrap; }
  #dot { width:10px; height:10px; border-radius:50%; background:#f59e0b; transition:background .2s; }
  #dot.on { background:#22c55e; box-shadow:0 0 8px #22c55e; }
  #hint { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.55); color:#fff;
    padding:16px 22px; border-radius:16px; text-align:center; font-size:14px; font-weight:600; line-height:1.6; max-width:80%; }
  #hint.hidden { display:none; }
  #hint small { display:block; margin-top:6px; font-size:11px; font-weight:500; color:#cbd5e1; }
  #card { position:absolute; left:12px; right:12px; bottom:14px; background:rgba(255,255,255,0.96); backdrop-filter:blur(10px);
    border-radius:16px; padding:14px 16px; box-shadow:0 6px 20px rgba(0,0,0,0.18); pointer-events:auto; }
  #card-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  #badge { padding:3px 10px; border-radius:12px; font-size:11px; font-weight:700; color:#fff; }
  #stitle { font-size:15px; font-weight:700; color:#1e293b; flex:1; line-height:1.3; }
  #sdetail { font-size:12.5px; color:#475569; line-height:1.6; white-space:pre-line; margin-bottom:10px; }
  #check-row { margin-bottom:10px; }
  #btn-check { width:100%; padding:11px 0; border:2px solid #d97706; border-radius:12px; background:#fffbeb; color:#b45309; font-size:14px; font-weight:800; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  #btn-check.checked { border-color:#16a34a; background:#f0fdf4; color:#15803d; }
  #btn-check:disabled { border-color:#cbd5e1; background:#f1f5f9; color:#94a3b8; cursor:not-allowed; }
  #nav { display:flex; gap:8px; }
  #nav button { flex:1; padding:12px 0; border:none; border-radius:12px; font-size:14px; font-weight:700; color:#fff; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  #nav button:disabled { opacity:.4; cursor:default; }
  #btn-prev { background:rgba(0,0,0,0.18); color:#1e293b; }
  #btn-next { background:#1d4ed8; }
  #btn-finish { background:#16a34a; }
  #counter { text-align:center; font-size:11px; color:#64748b; margin-top:8px; }
  .cbtn { width:34px; height:30px; border:1px solid #cbd5e1; border-radius:8px; background:#fff; font-weight:700; color:#334155; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .cbtn:active { background:#e0e7ff; }
  #btn-menu { pointer-events:auto; border:none; border-radius:9px; background:#1d4ed8; color:#fff; font-size:12px; font-weight:700; padding:6px 10px; cursor:pointer; }
  #doc-btn-row { display:flex; align-items:center; pointer-events:auto; }
  .doc-btn { padding:6px 10px; border:none; border-radius:9px; font-size:12px; font-weight:700; color:#fff; cursor:pointer; white-space:nowrap; -webkit-tap-highlight-color:transparent; }
  .doc-btn-pdf { background:#b91c1c; } .doc-btn-video { background:#7c3aed; }
  /* 右側フローティング操作 */
  #tool-fab { position:absolute; right:12px; top:96px; display:flex; flex-direction:column; gap:8px; pointer-events:auto; }
  #tool-fab button { border:none; border-radius:10px; padding:8px 11px; font-size:12px; font-weight:700; color:#fff; box-shadow:0 1px 4px rgba(0,0,0,.35); cursor:pointer; white-space:nowrap; }
  #btn-save { background:#0e7490; } #btn-log { background:#475569; } #btn-prog { background:#15803d; }
  /* 進捗一覧 */
  #progmodal { position:fixed; inset:0; z-index:61; display:none; align-items:center; justify-content:center; background:rgba(15,23,42,.55); padding:16px; }
  #progmodal .lm-box { background:#fff; border-radius:16px; padding:16px; width:100%; max-width:520px; max-height:84vh; display:flex; flex-direction:column; box-shadow:0 12px 40px rgba(0,0,0,.35); }
  #pg-sum { font-size:12.5px; color:#475569; font-weight:700; margin-bottom:10px; }
  #pg-bar { height:8px; border-radius:999px; background:#e2e8f0; overflow:hidden; margin-bottom:12px; }
  #pg-bar > i { display:block; height:100%; background:#15803d; width:0%; transition:width .2s; }
  #pg-list { overflow:auto; flex:1; }
  .pg-row { display:flex; align-items:center; gap:10px; border:1px solid #e2e8f0; border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer; }
  .pg-row.cur { border-color:#0e7490; background:#ecfeff; }
  .pg-num { width:26px; height:26px; border-radius:50%; background:#e2e8f0; color:#334155; font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .pg-title { flex:1; font-size:13px; color:#1e293b; font-weight:600; line-height:1.4; }
  .pg-badge { font-size:12px; font-weight:800; padding:3px 10px; border-radius:999px; flex-shrink:0; }
  .pg-badge.done { background:#dcfce7; color:#15803d; } .pg-badge.todo { background:#fef3c7; color:#b45309; }
  /* 選択メニュー */
  #scenpick { position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center; background:rgba(15,23,42,.5); padding:20px; }
  #scenpick .sp-box { background:#fff; border-radius:16px; padding:16px; width:100%; max-width:360px; max-height:80vh; overflow:auto; box-shadow:0 12px 40px rgba(0,0,0,.35); }
  #scenpick .sp-head { font-size:15px; font-weight:800; color:#1e293b; margin-bottom:12px; }
  .sp-item { display:block; width:100%; text-align:left; padding:14px; margin-bottom:9px; border:1px solid #e2e8f0; border-radius:11px; background:#f8fafc; cursor:pointer; }
  .sp-item b { display:block; font-size:15px; color:#1e293b; }
  .sp-item small { display:block; font-size:11px; color:#64748b; margin-top:2px; }
  .sp-item:active { background:#e0e7ff; }
  /* 作業記録モーダル */
  #logmodal { position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; background:rgba(15,23,42,.55); padding:16px; }
  #logmodal .lm-box { background:#fff; border-radius:16px; padding:16px; width:100%; max-width:520px; max-height:84vh; display:flex; flex-direction:column; box-shadow:0 12px 40px rgba(0,0,0,.35); }
  .lm-head { display:flex; align-items:center; font-size:15px; font-weight:800; color:#1e293b; margin-bottom:10px; }
  .lm-head button { margin-left:auto; width:30px; height:30px; border:none; border-radius:50%; background:#e2e8f0; font-size:15px; cursor:pointer; }
  #lm-list { overflow:auto; flex:1; }
  .lm-ses { border:1px solid #e2e8f0; border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:12.5px; color:#334155; }
  .lm-ses b { color:#0f172a; }
  .lm-ses .lm-meta { font-size:11px; color:#64748b; margin-top:3px; }
  .lm-ses .done { color:#15803d; font-weight:700; } .lm-ses .part { color:#b45309; font-weight:700; }
  .lm-act { display:flex; gap:8px; margin-top:12px; }
  .lm-act button { flex:1; padding:11px; border:none; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer; }
  #lm-csv { background:#16a34a; color:#fff; } #lm-json { background:#1d4ed8; color:#fff; } #lm-clear { background:#fee2e2; color:#b91c1c; }
  #toast { position:fixed; left:50%; bottom:calc(14px + 150px); transform:translateX(-50%); z-index:80; background:rgba(15,23,42,.92); color:#fff; padding:10px 16px; border-radius:12px; font-size:13px; font-weight:700; opacity:0; transition:opacity .25s; pointer-events:none; max-width:88%; text-align:center; white-space:pre-line; line-height:1.5; word-break:break-all; }
</style>
</head>
<body>
<a-scene embedded vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; precision: medium;"
  arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960; detectionMode: mono_and_matrix; matrixCodeType: 3x3; patternRatio: 0.5; maxDetectionRate: 120; debugUIEnabled: false;">
  <a-marker id="m0" type="barcode" value="0" smooth="true" smoothCount="4" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
  <a-marker id="m1" type="barcode" value="1" smooth="true" smoothCount="4" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
  <a-marker id="m2" type="barcode" value="2" smooth="true" smoothCount="4" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
  <a-marker id="m3" type="barcode" value="3" smooth="true" smoothCount="4" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
  <a-marker id="m4" type="barcode" value="4" smooth="true" smoothCount="4" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
  <a-marker id="m5" type="barcode" value="5" smooth="true" smoothCount="4" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
  <a-marker id="m6" type="barcode" value="6" smooth="true" smoothCount="4" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
  <a-marker id="m7" type="barcode" value="7" smooth="true" smoothCount="4" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
  <a-marker id="m8" type="barcode" value="8" smooth="true" smoothCount="4" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
  <a-marker id="m9" type="barcode" value="9" smooth="true" smoothCount="4" smoothTolerance="0.02" smoothThreshold="5"></a-marker>
  <a-entity id="anchor" smooth-follow="target: #m0; mc: 0.3; beta: 1.0">
    <a-entity id="markerframe" rotation="-90 0 0"></a-entity>
    <a-entity id="wrapper"><a-entity id="content" rotation="-90 0 0"></a-entity></a-entity>
  </a-entity>
  <a-entity camera></a-entity>
</a-scene>

<div id="ui">
  <div id="topbar">
    <div id="title"><span id="scname">シナリオ未選択</span><small id="scsub">バーコードにカメラを向けてください</small></div>
    <div id="doc-btn-row" style="display:none; gap:6px;"></div>
    <button id="btn-menu" style="display:none">≡ 操作</button>
    <div id="ver">Worklog v3.7</div>
  </div>
  <div id="status"><span id="dot"></span><span id="stxt">マーカー未認識</span></div>
  <div id="hint">バーコードマーカーにカメラを向けてください<small>登録済みのシナリオを自動表示します</small></div>

  <div id="tool-fab">
    <button id="btn-prog">✅ 進捗</button>
    <button id="btn-save">💾 保存</button>
    <button id="btn-log">📋 記録</button>
  </div>

  <button id="cal-toggle" style="position:absolute;left:12px;top:96px;pointer-events:auto;background:rgba(15,23,42,0.82);color:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer">校正</button>
  <div id="calib" style="position:absolute;left:12px;top:134px;pointer-events:auto;display:none;background:rgba(255,255,255,0.97);backdrop-filter:blur(8px);border-radius:12px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.2);font-size:12px;color:#1e293b;min-width:186px">
    <div style="font-size:11px;color:#64748b;margin-bottom:6px">校正対象: <b id="cal-target">-</b></div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><span style="width:36px">サイズ</span><button class="cbtn" data-cal="s-">－</button><b id="cal-s" style="flex:1;text-align:center">1.00</b><button class="cbtn" data-cal="s+">＋</button></div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><span style="width:36px">左右</span><button class="cbtn" data-cal="x-">←</button><b id="cal-x" style="flex:1;text-align:center">0.00</b><button class="cbtn" data-cal="x+">→</button></div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><span style="width:36px">上下</span><button class="cbtn" data-cal="y-">↓</button><b id="cal-y" style="flex:1;text-align:center">0.00</b><button class="cbtn" data-cal="y+">↑</button></div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px"><span style="width:36px">回転</span><button class="cbtn" data-cal="r" style="flex:1;width:auto">90°回す</button><b id="cal-r" style="width:36px;text-align:center">0</b></div>
    <button id="cal-copy" style="width:100%;padding:8px;border:none;border-radius:9px;background:#1d4ed8;color:#fff;font-weight:700;font-size:12px;cursor:pointer">校正値をコピー</button>
    <div id="cal-msg" style="font-size:10px;color:#475569;margin-top:6px;line-height:1.5;word-break:break-all"></div>
  </div>

  <div id="card">
    <div id="card-head"><span id="badge">STEP</span><span id="stitle">–</span><button id="btn-photo" style="display:none;margin-left:auto;flex-shrink:0;background:#0f766e;color:#fff;border:none;border-radius:9px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer">📷 参考写真</button></div>
    <div id="sdetail">–</div>
    <div id="check-row"><button id="btn-check">☑ このステップを確認しました</button></div>
    <div id="nav"><button id="btn-prev">‹ 戻る</button><button id="btn-next">次へ ›</button><button id="btn-finish" style="display:none">✓ 終了</button></div>
    <div id="counter">– / –</div>
  </div>
</div>

<!-- ドキュメント閲覧フロート窓 -->
<div id="doc-viewer" style="display:none; position:fixed; z-index:300; left:50vw; top:12vh; width:46vw; height:34vh; min-width:160px; min-height:120px; background:#fff; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.35); flex-direction:column; overflow:hidden;">
  <div id="doc-viewer-head" style="display:flex; align-items:center; gap:8px; padding:8px 10px; background:#1e293b; cursor:move; touch-action:none;">
    <span style="color:#64748b; font-size:14px;">⠿</span>
    <div id="doc-viewer-title" style="flex:1; color:#fff; font-weight:700; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></div>
    <a id="doc-viewer-ext" href="#" target="_blank" rel="noopener" style="color:#93c5fd; font-size:11px; text-decoration:underline; white-space:nowrap;">別タブ</a>
    <button onclick="closeDoc()" style="width:28px; height:28px; border-radius:50%; border:none; background:rgba(255,255,255,0.9); color:#1e293b; font-size:16px; font-weight:700; cursor:pointer; flex-shrink:0;">✕</button>
  </div>
  <div id="doc-viewer-body" style="flex:1; background:#fff; overflow:hidden;"></div>
  <div id="doc-viewer-resize" title="サイズ変更" style="position:absolute; right:0; bottom:0; width:28px; height:28px; cursor:nwse-resize; touch-action:none; background:linear-gradient(135deg, transparent 45%, rgba(30,41,59,0.55) 45%); border-bottom-right-radius:12px;"></div>
</div>

<!-- ステップ参考写真フロート窓（移動・リサイズ・✕で非表示） -->
<div id="photo-viewer" style="display:none; position:fixed; z-index:301; left:8vw; top:16vh; width:40vw; height:38vh; min-width:140px; min-height:110px; background:#fff; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.35); flex-direction:column; overflow:hidden;">
  <div id="photo-viewer-head" style="display:flex; align-items:center; gap:8px; padding:8px 10px; background:#0f766e; cursor:move; touch-action:none;">
    <span style="color:#99f6e4; font-size:14px;">⠿</span>
    <div id="photo-viewer-title" style="flex:1; color:#fff; font-weight:700; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">参考写真</div>
    <button onclick="closePhoto()" style="width:28px; height:28px; border-radius:50%; border:none; background:rgba(255,255,255,0.9); color:#0f766e; font-size:16px; font-weight:700; cursor:pointer; flex-shrink:0;">✕</button>
  </div>
  <div id="photo-viewer-body" style="flex:1; background:#111827; overflow:auto; display:flex; align-items:center; justify-content:center;"></div>
  <div id="photo-viewer-resize" title="サイズ変更" style="position:absolute; right:0; bottom:0; width:28px; height:28px; cursor:nwse-resize; touch-action:none; background:linear-gradient(135deg, transparent 45%, rgba(15,118,110,0.6) 45%); border-bottom-right-radius:12px;"></div>
</div>

<!-- シナリオ選択メニュー -->
<div id="scenpick">
  <div class="sp-box">
    <div class="sp-head">操作を選択　<span id="sp-dev" style="font-weight:500;color:#94a3b8;font-size:11px"></span></div>
    <div id="sp-list"></div>
  </div>
</div>

<!-- ステップ進捗（未・済）一覧モーダル -->
<div id="progmodal">
  <div class="lm-box">
    <div class="lm-head">ステップ進捗（未・済）<button id="pg-close">✕</button></div>
    <div id="pg-sum">–</div>
    <div id="pg-bar"><i></i></div>
    <div id="pg-list"></div>
  </div>
</div>

<!-- 作業記録モーダル -->
<div id="logmodal">
  <div class="lm-box">
    <div class="lm-head">作業記録<button id="lm-close">✕</button></div>
    <div id="lm-list"></div>
    <div class="lm-act">
      <button id="lm-csv">CSV書出</button>
      <button id="lm-json">JSON書出</button>
      <button id="lm-clear">全消去</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const WARN = { normal:{c:'#1d4ed8',label:'通常',sym:''}, caution:{c:'#d97706',label:'注意',sym:'⚠️'}, danger:{c:'#dc2626',label:'危険',sym:'⛔'} };
const SCEN = {};

// ══════ オフライン対応（Service Worker） ══════
// アプリ本体・AR.js・PDF.jsをキャッシュし、圏外でもアプリを起動可能に（iOS制約でstandalone化はせずSafariで開く）。
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
window.addEventListener('offline', ()=>{ try{ toast('📴 オフライン：保存済みで動作します'); }catch(_){} });
window.addEventListener('online',  ()=>{ try{ toast('📶 オンラインに復帰しました'); }catch(_){} });

// ══════ 1€(OneEuro)フィルタ＋マーカー追従 ══════
function _LP(){ this.s=null; }
_LP.prototype.f=function(x,a){ this.s=(this.s===null)?x:(a*x+(1-a)*this.s); return this.s; };
function _euA(cut,dt){ const tau=1/(2*Math.PI*cut); return 1/(1+tau/dt); }
function OneEuro(mc,beta,dc){ this.mc=mc; this.beta=beta; this.dc=dc||1.0; this.x=new _LP(); this.dx=new _LP(); this.lx=null; }
OneEuro.prototype.f=function(x,dt){ const dv=(this.lx===null)?0:(x-this.lx)/dt; this.lx=x; const ed=this.dx.f(dv,_euA(this.dc,dt)); const cut=this.mc+this.beta*Math.abs(ed); return this.x.f(x,_euA(cut,dt)); };

// ══════ 推定ホールド（バーコード見切れ中も端末の“回転”をジャイロで補正して表示継続。再検出で正確位置へスナップ補正） ══════
// ?hold=off で無効化。既定は無制限ホールド（消さない）。並進(歩行)は推定不可＝ずれる前提で、再検出時に補正する運用。
const HOLD_ENABLED = ((new URLSearchParams(location.search).get('hold')||'on')!=='off');

  const bg=it.textBg||'rgba(0,0,0,0.82)';
  const fg=(it.type==='text') ? (it.textColor||it.color||'#ffffff') : (it.textColor||'#ffffff');
  const lm=it.label ? labelMetrics(tmp,it.label,fp) : null;
  const labelW=lm?lm.w+52:0, labelH=lm?lm.h+32:0;
  let iw=0,ih=0;
  if(it.type==='box'){ iw=(it.sizeW||it.size||0.5)*PXREF; ih=(it.sizeH||it.size||0.5)*PXREF; }
  else if(it.type==='ring'){ iw=ih=(it.size||0.6)*PXREF; }
  else if(it.type==='arrow'||it.type==='arrowDown'){ ih=(it.h||0.5)*PXREF; iw=ih*0.7; }
  else if(it.type==='curvedArrow'){ iw=ih=(it.size||(it.scale?it.scale*0.09:0.2))*PXREF; }
  // ラベル位置：labelPos(正規化オフセット)があれば任意配置、無ければ既定(上/下)。図形は常にキャンバス中央=it.pos。
  const lp=(it.label&&it.type!=='text')?(it.labelPos||defaultLabelOffset(it)):{x:0,y:0};
  const lxPx=(lp.x||0)*PXREF, lyPx=-(lp.y||0)*PXREF;
  const halfW=Math.max(iw/2, (it.label?Math.abs(lxPx)+labelW/2:0))+15;
  const halfH=Math.max(ih/2, (it.label?Math.abs(lyPx)+labelH/2:0))+10;
  const cw=2*halfW, ch=2*halfH;
  const cv=document.createElement('canvas'); cv.width=Math.max(2,Math.ceil(cw)); cv.height=Math.max(2,Math.ceil(ch));
  const ctx=cv.getContext('2d'); const CX=cv.width/2, CY=cv.height/2;
  if(it.type==='box') iconBox(ctx,CX,CY,iw,ih,color,(it.lineThick||0.015)*PXREF);
  else if(it.type==='ring'){ ctx.beginPath(); ctx.arc(CX,CY,iw/2,0,Math.PI*2); ctx.lineWidth=(it.lineThick!=null)?(it.lineThick*PXREF):Math.max(10,(iw/2)*0.28); ctx.strokeStyle=color; ctx.stroke(); }
  else if(it.type==='arrow') iconArrow(ctx,CX,CY,iw,ih,color,'up');
  else if(it.type==='arrowDown') iconArrow(ctx,CX,CY,iw,ih,color,'down');
  else if(it.type==='curvedArrow') iconCurved(ctx,CX,CY,iw/2,color,it.dir);
  if(it.label){ if(it.type==='text') drawLabel(ctx,CX,CY,it.label,fp,bg,fg,it.align);
    else drawLabel(ctx, CX+lxPx, CY+lyPx, it.label, fp,bg,fg); }
  const el=planeFromCanvas(cv, it.pos[0]+cal.ox, it.pos[1]+cal.oy, it.pos[2]);
  // 図形ごとの3D回転（面内Z＋奥行きX/Y）。図形はcontrolの子なのでローカル回転。
  if(it.rot&&(it.rot.x||it.rot.y||it.rot.z)) el.setAttribute('rotation', `${it.rot.x||0} ${it.rot.y||0} ${it.rot.z||0}`);
  return el;
}

// ══════ IndexedDB（作業ログ・端末保存） ══════
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open('worklog',1);
  r.onupgradeneeded=()=>{ const db=r.result;
    if(!db.objectStoreNames.contains('logs')) db.createObjectStore('logs',{keyPath:'id',autoIncrement:true});
    if(!db.objectStoreNames.contains('scenarios')) db.createObjectStore('scenarios',{keyPath:'id'});
    if(!db.objectStoreNames.contains('assets')) db.createObjectStore('assets',{keyPath:'url'});
    if(!db.objectStoreNames.contains('saved')) db.createObjectStore('saved',{keyPath:'barcode'});
  };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbPut(store,val){ const db=await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction(store,'readwrite'); tx.objectStore(store).put(val); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function idbGet(store,key){ const db=await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction(store,'readonly'); const rq=tx.objectStore(store).get(key); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
async function idbAll(store){ const db=await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction(store,'readonly'); const rq=tx.objectStore(store).getAll(); rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>rej(rq.error); }); }
async function idbClear(store){ const db=await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction(store,'readwrite'); tx.objectStore(store).clear(); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }

let _framePlane=null, _frameURL={};
function _makeFrameURL(color){
  const S=512, cv=document.createElement('canvas'); cv.width=cv.height=S; const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,S,S); ctx.strokeStyle=color; ctx.lineWidth=S*0.035;
  const m=ctx.lineWidth/2+1; ctx.strokeRect(m,m,S-2*m,S-2*m);
  ctx.lineWidth=S*0.06; ctx.lineCap='round'; const L=S*0.16, o=S*0.04;
  [[o,o,1,1],[S-o,o,-1,1],[o,S-o,1,-1],[S-o,S-o,-1,-1]].forEach(([x,y,sx,sy])=>{
    ctx.beginPath(); ctx.moveTo(x, y+sy*L); ctx.lineTo(x,y); ctx.lineTo(x+sx*L, y); ctx.stroke(); });
  return cv.toDataURL('image/png');
}
const FRAME_GREEN='#22c55e', FRAME_YELLOW='#f59e0b';

})();

function renderStep(){ const sc=cur; if(!sc) return; const step=sc.steps[idx]; const w=WARN[step.warn]||WARN.normal; const col=w.c;

function followMarker(markerId){ if(curMid===markerId) return; curMid=markerId;

// 画像オーバーレイのsrcを端末保存blob(あれば)へ解決してから再描画（オフライン対応。無ければURLのまま）
function resolveImageAssets(){ if(!cur) return;
  const urls=new Set(); cur.steps.forEach(s=>(s.ar||[]).forEach(f=>{ if(f.type==='image'&&f.src&&!f._src) urls.add(f.src); }));
  if(!urls.size) return;
  Promise.all([...urls].map(async u=>{ try{ const a=await idbGet('assets',u); if(a&&a.blob){ const o=URL.createObjectURL(a.blob);
        cur.steps.forEach(s=>(s.ar||[]).forEach(f=>{ if(f.type==='image'&&f.src===u) f._src=o; })); } }catch(_){} }))
    .then(()=>{ if(cur) renderStep(); });
}

async function openDoc(type,url,label){

  document.getElementById('doc-viewer-ext').href=url;

    try{ const a=await idbGet('assets',url); if(a&&a.blob) realUrl=URL.createObjectURL(a.blob); }catch(_){}
  }

    body.innerHTML=`<video id="dv-video" src="${realUrl}" controls autoplay playsinline style="width:100%;height:100%;background:#000;"></video>`;

let _pdfjsLoading=null;
const PDFJS_LOCAL='libs/pdf.min.js', PDFJS_LOCAL_W='libs/pdf.worker.min.js';
const PDFJS_CDN='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', PDFJS_CDN_W='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
function loadScriptEl(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('読み込み失敗: '+src)); document.head.appendChild(s); }); }
function loadPdfJs(){ if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib); if(_pdfjsLoading) return _pdfjsLoading;
  _pdfjsLoading=(async()=>{ try{ await loadScriptEl(PDFJS_LOCAL); window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_LOCAL_W; }
    catch(_){ await loadScriptEl(PDFJS_CDN); window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_CDN_W; }
    if(!window.pdfjsLib) throw new Error('PDF.jsの読み込みに失敗'); return window.pdfjsLib; })(); return _pdfjsLoading; }
async function renderPdf(url,container){
  container.innerHTML='<div style="padding:16px;color:#64748b;font-size:13px;">PDF読み込み中…</div>';
  try{ const pdfjsLib=await loadPdfJs(); const pdf=await pdfjsLib.getDocument(url).promise;
    const scroll=document.createElement('div'); scroll.style.cssText='width:100%;height:100%;overflow:auto;-webkit-overflow-scrolling:touch;background:#525659;';
    container.innerHTML=''; container.appendChild(scroll);
    for(let n=1;n<=pdf.numPages;n++){ const page=await pdf.getPage(n); const viewport=page.getViewport({scale:1.5});
      const canvas=document.createElement('canvas'); canvas.width=viewport.width; canvas.height=viewport.height;
      canvas.style.cssText='display:block;margin:8px auto;max-width:100%;box-shadow:0 2px 8px rgba(0,0,0,0.3);';
      scroll.appendChild(canvas); await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise; }
  }catch(e){ container.innerHTML=`<div style="padding:16px;color:#dc2626;font-size:13px;">PDFの表示に失敗しました。上部の「別タブ」から開いてください。<br>${e.message}</div>`; }
}

let _docDragInit=false;

const _floatInited=new Set();
function initFloatDragResize(panelId,headId,gripId){
  if(_floatInited.has(panelId)) return; const panel=document.getElementById(panelId); const head=document.getElementById(headId); const grip=document.getElementById(gripId);
  if(!panel||!head||!grip) return; _floatInited.add(panelId);
  const clamp=(v,mn,mx)=>Math.max(mn,Math.min(mx,v)); let mode=null,sx=0,sy=0,sl=0,st=0,sw=0,sh=0;
  head.addEventListener('pointerdown',e=>{ if(e.target.closest('a,button')) return; const r=panel.getBoundingClientRect(); sx=e.clientX;sy=e.clientY;sl=r.left;st=r.top; mode='move'; try{head.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); });
  grip.addEventListener('pointerdown',e=>{ const r=panel.getBoundingClientRect(); sx=e.clientX;sy=e.clientY;sw=r.width;sh=r.height;sl=r.left;st=r.top; mode='resize'; try{grip.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); });
  function onMove(e){ if(!mode) return;
    if(mode==='move'){ const w=panel.offsetWidth,h=panel.offsetHeight;
      panel.style.left=clamp(sl+(e.clientX-sx),0,window.innerWidth-w)+'px'; panel.style.top=clamp(st+(e.clientY-sy),0,window.innerHeight-h)+'px'; panel.style.right='auto'; panel.style.bottom='auto'; }
    else { panel.style.width=clamp(sw+(e.clientX-sx),160,window.innerWidth-sl)+'px'; panel.style.height=clamp(sh+(e.clientY-sy),120,window.innerHeight-st)+'px'; }
    e.preventDefault(); }
  const end=()=>{mode=null;};
  head.addEventListener('pointermove',onMove); grip.addEventListener('pointermove',onMove);
  head.addEventListener('pointerup',end); grip.addEventListener('pointerup',end); head.addEventListener('pointercancel',end); grip.addEventListener('pointercancel',end);
}

document.getElementById('btn-finish').onclick=()=>{ if(!document.getElementById('btn-finish').disabled) finishScenario(); };

// ══════ マーカー認識（多面対応） ══════
const dot=document.getElementById('dot'), stxt=document.getElementById('stxt'), hint=document.getElementById('hint');
let lostTimer=null;
// 確認ゲート：バーコード認識中だけ「このステップを確認しました」を押せる（現場不在での一括“済”化を防止）。?checkgate=off で解除。
const CHECK_GATE = (new URLSearchParams(location.search).get('checkgate')!=='off');
function updateCheckGate(vis){ const bc=document.getElementById('btn-check'); if(!bc) return;
  if(!cur){ bc.disabled=true; return; }
  if(checkedSteps.has(idx)){ bc.disabled=false; bc.textContent='✓ 確認済み'; }
  else if(CHECK_GATE){ bc.disabled=!vis; bc.textContent = vis ? '☑ このステップを確認しました' : '🔒 バーコード認識中のみ確認できます'; }
  else { bc.disabled=false; bc.textContent='☑ このステップを確認しました'; }
}
// 現ステップが欲しい面のマーカーが見えているか→認識表示 or 「その面へ」誘導
function updateWanted(){
  if(!cur){ content.setAttribute('visible', false); return; }
  const face=curFace(); const w=String(face.barcode);
  const vis=_visible.has(w);
  updateCheckGate(vis);   // 認識中だけ「確認しました」を押せるように
  followMarker('m'+w);   // 追従対象を現ステップの面へ（見切れ中の推定ホールドもこの面の最後の姿勢を使う）
  const sf=anchor.components&&anchor.components['smooth-follow'];
  // 一度でも認識できた面なら、見切れ中も推定ホールドで表示継続（?hold=off で無効）
  const holding = !vis && HOLD_ENABLED && !!(sf&&sf._hasPose);
  content.setAttribute('visible', vis || holding);
  if(vis){
    if(lostTimer){clearTimeout(lostTimer);lostTimer=null;}
    dot.classList.add('on'); dot.style.background=''; hint.classList.add('hidden'); setFrameRecognized(true);
    stxt.textContent='認識中：'+cur.name+(isMultiFace()?(' ／ '+(face.label||'')):'');
  } else if(holding){
    // 推定表示中：バーコード見切れ。回転はジャイロ補正、位置は再検出で補正。
    dot.classList.remove('on'); dot.style.background='#f59e0b'; hint.classList.add('hidden'); setFrameRecognized(false);
    stxt.textContent='推定表示中：'+cur.name+(isMultiFace()?(' ／ '+(face.label||'')):'')+'（バーコードを写すと補正）';
  } else {
    dot.classList.remove('on'); dot.style.background=''; setFrameRecognized(false); hint.classList.remove('hidden');
    hint.innerHTML = isMultiFace()
      ? ('「'+(face.label||'次の面')+'」のマーカーにカメラを向けてください<small>次の操作はこの面です</small>')
      : 'マーカーにカメラを向けてください<small>登録済みのシナリオを自動表示します</small>';
    stxt.textContent = isMultiFace() ? ((face.label||'次の面')+'マーカー待ち') : 'マーカー未認識';
  }
}
// 新規にシナリオへ入る（開始面のマーカーからのみ）
function onFound(key,markerId){ if(lostTimer){clearTimeout(lostTimer);lostTimer=null;}
  const list=entryScenarios(key);   // このマーカーを「開始面」とするシナリオのみ
  if(!list.length){ // 途中用の面（他シナリオの側面/背面など）→ 自動開始しない
    followMarker(markerId); dot.classList.remove('on'); setFrameRecognized(false); hint.classList.remove('hidden');
    hint.innerHTML='この面は作業の途中用です<small>作業の開始は最初の面のマーカーから</small>';
    stxt.textContent='開始面ではありません（value='+key+'）';
    return;
  }
  followMarker(markerId);
  if(list.length===1){ setScenario(list[0],key,markerId); }
  else { curKey=key; dot.classList.add('on'); hint.classList.add('hidden'); setFrameRecognized(true);
    stxt.textContent='認識中：操作を選択（'+list.length+'件）'; showPicker(key,markerId); }
}

// ══════ 誤読ガード（切替安定化） ══════
const SWITCH_MS = parseInt(new URLSearchParams(location.search).get('switchms')||'700',10);
const _visible=new Set();
let pendingKey=null, pendingMid=null, pendingTimer=null;
function clearPending(){ if(pendingTimer){clearTimeout(pendingTimer);pendingTimer=null;} pendingKey=null; pendingMid=null; }
function handleFound(key, mid){
  if(!SCENARIOS[key]||!SCENARIOS[key].length){ if(!cur && !curKey){ dot.classList.remove('on');
    const total=Object.keys(SCENARIOS).length;
    stxt.textContent = total ? ('未登録のバーコード（value='+key+'／読込'+total+'件）')
      : ('シナリオ未読込（value='+key+'）'+(navigator.onLine?'：取得失敗の可能性':'：オフライン'));
    if(!total){ hint.classList.remove('hidden'); hint.innerHTML='シナリオを取得できていません<small>'+(navigator.onLine?('通信/GitHub制限の可能性。再読込するか、オンラインの端末で「この機器を保存」を実施'):'オフライン：オンライン時に開くか、事前に端末保存が必要')+'</small>'; }
  } return; }
  _visible.add(key);
  // ── 再生中は割り込ませない：現在のシナリオの面のマーカーだけ反応、他は無視 ──
  if(cur){
    if(faceKeys(cur).has(key)){ clearPending(); if(lostTimer){clearTimeout(lostTimer);lostTimer=null;} updateWanted(); }
    return; // 別シナリオのマーカーを捉えても何も起きない（切替は「終了」してから）
  }
  // 選択メニュー表示中の同一キー → 維持
  if(key===curKey){ clearPending(); dot.classList.add('on'); setFrameRecognized(true); return; }
  // 未選択 → エントリ（開始面のみ）
  if(!curKey){ onFound(key,mid); return; }
  // 選択メニュー表示中に別マーカーを継続認識 → そちらへ（まだ再生前なので許可）
  if(pendingKey!==key){ clearPending(); pendingKey=key; pendingMid=mid;
    pendingTimer=setTimeout(()=>{ pendingTimer=null;
      if(_visible.has(key) && !_visible.has(curKey)){ clearPending(); curKey=null; hidePicker(); onFound(key,mid); }
      else clearPending();
    }, SWITCH_MS);
  }
}
function handleLost(key){ _visible.delete(key); if(key===pendingKey) clearPending();
  if(cur && faceKeys(cur).has(key)){
    if(key===wantKey()){ if(lostTimer)clearTimeout(lostTimer); lostTimer=setTimeout(()=>{ lostTimer=null; updateWanted(); },1000); }
    return;
  }
  if(!cur && key===curKey){ if(lostTimer)clearTimeout(lostTimer);
    lostTimer=setTimeout(()=>{ lostTimer=null; if(![..._visible].some(k=>SCENARIOS[k]&&SCENARIOS[k].length)){ dot.classList.remove('on'); stxt.textContent='マーカー未認識'; hint.classList.remove('hidden'); setFrameRecognized(false); } },1000);
  }
}
for(let v=0; v<=9; v++){
  const el=document.getElementById('m'+v); if(!el) continue;
  const key=String(v), mid='m'+v;
  el.addEventListener('markerFound',()=>handleFound(key,mid));
  el.addEventListener('markerLost',()=>handleLost(key));
}

// ══════ シナリオ読込（端末保存＋GitHub） ══════
const GH_OWNER='ifx-mori', GH_REPO='IFX_AR-', BARCODE_DIR='barcode-scenarios';
function addScenarioToGroup(key, s, replaceBuiltin){
  if(replaceBuiltin && !_ghKeys.has(key)){ _ghKeys.add(key); SCENARIOS[key]=[]; }
  if(!SCENARIOS[key]) SCENARIOS[key]=[];
  if(!SCENARIOS[key].some(e=>e.id===s.id)) SCENARIOS[key].push(s);
}
// GitHubのblob/raw URLを同一オリジンのPages URLへ変換（資料の取得・表示を安定化）
function normalizeGhUrl(u){ u=String(u==null?'':u).trim(); if(!u) return '';
  let m=u.match(/^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/[^/]+\/(.+)$/i);
  if(m) return `https://${m[1].toLowerCase()}.github.io/${m[2]}/${m[3]}`;
  m=u.match(/^https?:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/[^/]+\/(.+)$/i);
  if(m) return `https://${m[1].toLowerCase()}.github.io/${m[2]}/${m[3]}`;
  return u; }
function normDocs(d){ if(!d) return null; const o={}; const p=normalizeGhUrl(d.pdf||''); const v=normalizeGhUrl(d.video||''); if(p)o.pdf=p; if(v)o.video=v; return (o.pdf||o.video)?o:null; }
function normalizeScenario(s){
  let faces;
  if(Array.isArray(s.faces)&&s.faces.length){
    faces=s.faces.map((f,i)=>({ key:f.key||('f'+(i+1)), label:f.label||('面'+(i+1)), barcode:f.barcode,
      markerSizeMM:f.markerSizeMM||40, calib:Object.assign({scale:6,ox:0,oy:0,rot:0}, f.calib||{}) }));
  } else {
    faces=[{ key:'f1', label:'', barcode:s.barcode, markerSizeMM:s.markerSizeMM||40, calib:Object.assign({scale:6,ox:0,oy:0,rot:0}, s.calib||{}) }];
  }
  const fkeys=faces.map(f=>f.key);
  const steps=(s.steps||[]).map(st=>Object.assign({}, st, {
    face:(fkeys.includes(st.face)?st.face:fkeys[0]),
    ar:(st.ar||[]).map(f=> f.type==='image' ? Object.assign({}, f, { src:normalizeGhUrl(f.src||'') }) : f)   // 画像srcはPages URLへ正規化
  }));
  return { id:s.id, name:s.name||('barcode '+(faces[0].barcode)), subtitle:s.subtitle||'', device:s.device||'',
    docs:normDocs(s.docs), faces, barcode:faces[0].barcode, calib:faces[0].calib, steps };
}
function registerScenario(sc, replaceBuiltin){ faceKeys(sc).forEach(k=> addScenarioToGroup(k, sc, replaceBuiltin)); }
// 端末保存分を先に読み込む（オフラインでも表示可能に）
async function loadLocalScenarios(){
  try{ const saved=await idbAll('saved'); if(!saved.length) return;
    const scen=await idbAll('scenarios');
    const seen=new Set();
    scen.forEach(x=>{ if(!x.data||seen.has(x.id)) return; seen.add(x.id); registerScenario(normalizeScenario(x.data), false); });
    Object.keys(SCENARIOS).forEach(k=>SCENARIOS[k].sort((a,b)=>String(a.name).localeCompare(String(b.name),'ja')));
  }catch(_){}
}
let _loadInfo={count:0, src:'', status:0};
function _registerBatch(jsons){
  jsons=jsons.filter(s=>s&&Array.isArray(s.steps)&&(Number.isInteger(s.barcode)||(Array.isArray(s.faces)&&s.faces.length)));
  jsons.forEach(s=> registerScenario(normalizeScenario(s), true));
  Object.keys(SCENARIOS).forEach(k=>SCENARIOS[k].sort((a,b)=>String(a.name).localeCompare(String(b.name),'ja')));
  if(cur){ applyCal(); renderStep(); updateDocButtons(); }
  return jsons.length;
}
async function loadRemoteScenarios(){
  const bust='t='+Date.now();
  const pages=`https://${GH_OWNER.toLowerCase()}.github.io/${GH_REPO}/${BARCODE_DIR}`;
  // ① GitHub Pages の index.json を優先（APIレート制限なし・非公開でなければ確実）
  try{
    const ir=await fetch(`${pages}/index.json?${bust}`,{cache:'no-store'});
    if(ir.ok){ const idx=await ir.json(); const files=Array.isArray(idx)?idx:((idx&&Array.isArray(idx.files))?idx.files:[]);
      if(files.length){
        const jsons=await Promise.all(files.map(fn=>{ const name=(typeof fn==='string')?fn:(fn&&(fn.file||fn.name)); if(!name) return null;
          return fetch(`${pages}/${name}?${bust}`,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null); }));
        const n=_registerBatch(jsons); _loadInfo={count:n, src:'pages', status:ir.status};
        if(n>0) return;
      }
    }
  }catch(_){}
  // ② フォールバック：GitHub API（未認証は60回/時制限）
  try{
    const res=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${BARCODE_DIR}?ref=main&${bust}`,
      {headers:{Accept:'application/vnd.github+json'},cache:'no-store'});
    _loadInfo.status=res.status;
    if(!res.ok){ if(res.status===403){ try{ toast('⚠ シナリオ取得がGitHubの制限(403)に到達。時間をおくか、機器保存済みでご利用ください'); }catch(_){} } return; }
    const files=await res.json();
    const jsons=await Promise.all((Array.isArray(files)?files:[])
      .filter(f=>f.name.endsWith('.json')&&f.download_url)
      .map(f=>fetch(f.download_url+(f.download_url.includes('?')?'&':'?')+bust,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)));
    const n=_registerBatch(jsons); _loadInfo={count:n, src:'api', status:res.status};
  }catch(_){ /* オフライン等：端末保存分で動作 */ }
}
(async()=>{ await loadLocalScenarios(); await loadRemoteScenarios(); })();

// ══════ ③「この機器を保存」（オフライン用） ══════
async function saveDevice(){
  const key=curKey; const list=(SCENARIOS[key]||[]).slice();
  if(!key || !list.length){ toast('先に機器のバーコードを認識してください'); return; }
  toast('端末に保存中…');
  try{
    let assetOk=0, assetNg=0; const fails=[];
    for(const s of list){
      await idbPut('scenarios', { id:s.id, barcode:key, data:s });
      // 資料(PDF/動画)＋画像オーバーレイのURLを収集して端末保存
      const urls=[];
      for(const kind of ['pdf','video']){ const u=s.docs&&s.docs[kind]; if(u) urls.push(u); }
      (s.steps||[]).forEach(st=>(st.ar||[]).forEach(f=>{ if(f.type==='image'&&f.src) urls.push(f.src); }));
      for(const url of urls){ const fname=url.split('/').pop();
        try{ const r=await fetch(url,{cache:'no-store'}); if(r.ok){ const blob=await r.blob(); await idbPut('assets',{url,blob,type:r.headers.get('content-type')||''}); assetOk++; }
             else { assetNg++; fails.push(fname+' HTTP'+r.status); } }
        catch(e){ assetNg++; fails.push(fname+' '+((e&&e.name)||'fetch失敗')); console.warn('資料取得失敗',url,e); }
      }
    }
    await idbPut('saved', { barcode:key, device:(list[0].device||''), savedAt:Date.now(), ids:list.map(s=>s.id) });
    if(assetNg) toast(`⚠ ${list.length}操作保存／資料${assetOk}件・失敗${assetNg}\n`+fails.join(' / '));
    else toast(`✅ この機器を保存（${list.length}操作／資料${assetOk}件）`);
  }catch(e){ toast('保存失敗: '+((e&&e.message)||e)); }
}
document.getElementById('btn-save').onclick=saveDevice;

// ══════ 作業記録モーダル ══════
function download(name, text, mime){ const blob=new Blob([text],{type:mime||'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); }
function pad2(n){ return (n<10?'0':'')+n; }
function fmtTs(ts){ const d=new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; }
function logsToCsv(logs){
  const cols=['日時','セッション','バーコード','機器','操作','イベント','ステップ番号','ステップ名','総ステップ'];
  const esc=v=>{ v=(v==null?'':String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const rows=logs.slice().sort((a,b)=>a.ts-b.ts).map(l=>[fmtTs(l.ts), l.sessionId, l.barcode||'', l.device||'', l.scenarioName||'', l.event, l.step||'', l.stepTitle||'', l.totalSteps||''].map(esc).join(','));
  return '﻿'+cols.join(',')+'\n'+rows.join('\n');
}
async function openLog(){
  const logs=await idbAll('logs');
  const bySes={}; logs.forEach(l=>{ (bySes[l.sessionId]=bySes[l.sessionId]||[]).push(l); });
  const sessions=Object.values(bySes).map(arr=>{ arr.sort((a,b)=>a.ts-b.ts); const f=arr[0], last=arr[arr.length-1];
    const checks=new Set(arr.filter(x=>x.event==='check').map(x=>x.step)).size;
    const fin=arr.some(x=>x.event==='finish');
    return { start:f.ts, end:last.ts, device:f.device, scenario:f.scenarioName, barcode:f.barcode, checks, total:f.totalSteps||'', fin };
  }).sort((a,b)=>b.start-a.start);
  const list=document.getElementById('lm-list');
  if(!sessions.length){ list.innerHTML='<div style="color:#64748b;font-size:13px;padding:8px">まだ記録がありません</div>'; }
  else { list.innerHTML=sessions.map(s=>`<div class="lm-ses">
      <b>${s.scenario||'(操作なし)'}</b> ${s.device?('／ '+s.device):''}
      <div class="lm-meta">${fmtTs(s.start)}　value=${s.barcode}　確認 ${s.checks}${s.total?('/'+s.total):''}　<span class="${s.fin?'done':'part'}">${s.fin?'完了':'中断'}</span></div>
    </div>`).join(''); }
  document.getElementById('logmodal').style.display='flex';
}
document.getElementById('btn-log').onclick=openLog;
document.getElementById('lm-close').onclick=()=>{ document.getElementById('logmodal').style.display='none'; };

// ══════ ステップ進捗（未・済）一覧 ══════
function openProg(){
  const list=document.getElementById('pg-list'), sum=document.getElementById('pg-sum'), bar=document.querySelector('#pg-bar > i');
  if(!cur){ sum.textContent='シナリオを開始すると、ここに各ステップの未・済が表示されます'; bar.style.width='0%'; list.innerHTML=''; }
  else {
    const total=cur.steps.length, done=[...checkedSteps].filter(i=>i<total).length;
    sum.textContent=`${cur.name}　済 ${done} / ${total} ステップ`;
    bar.style.width=(total? Math.round(done/total*100):0)+'%';
    list.innerHTML=cur.steps.map((s,i)=>{ const ok=checkedSteps.has(i); const t=(s.title||('ステップ'+(i+1)));
      return `<div class="pg-row${i===idx?' cur':''}" data-i="${i}"><span class="pg-num">${i+1}</span><span class="pg-title">${escHtml(t)}</span><span class="pg-badge ${ok?'done':'todo'}">${ok?'済':'未'}</span></div>`;
    }).join('');
    list.querySelectorAll('.pg-row').forEach(r=>r.onclick=()=>{ const i=+r.getAttribute('data-i'); if(cur&&i>=0&&i<cur.steps.length){ idx=i; renderStep(); document.getElementById('progmodal').style.display='none'; } });
  }
  document.getElementById('progmodal').style.display='flex';
}
function escHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
document.getElementById('btn-prog').onclick=openProg;
document.getElementById('pg-close').onclick=()=>{ document.getElementById('progmodal').style.display='none'; };
document.getElementById('lm-csv').onclick=async()=>{ const logs=await idbAll('logs'); if(!logs.length){toast('記録がありません');return;} download('worklog_'+Date.now()+'.csv', logsToCsv(logs), 'text/csv;charset=utf-8'); toast('CSVを書き出しました'); };
document.getElementById('lm-json').onclick=async()=>{ const logs=await idbAll('logs'); if(!logs.length){toast('記録がありません');return;} download('worklog_'+Date.now()+'.json', JSON.stringify(logs,null,2), 'application/json'); toast('JSONを書き出しました'); };
document.getElementById('lm-clear').onclick=async()=>{ if(!confirm('すべての作業記録を消去します。よろしいですか？')) return; await idbClear('logs'); openLog(); toast('記録を消去しました'); };

// ══════ 校正パネル ══════
document.getElementById('cal-toggle').onclick=()=>{ const p=document.getElementById('calib'); p.style.display=(p.style.display==='none'||!p.style.display)?'block':'none'; };
document.querySelectorAll('#calib .cbtn').forEach(bn=>{ bn.onclick=()=>{ if(!cur){return;} const c=curFace().calib; const k=bn.getAttribute('data-cal');
  if(k==='s+') c.scale=+Math.min(30,c.scale*1.1).toFixed(2);
  else if(k==='s-') c.scale=+Math.max(0.5,c.scale/1.1).toFixed(2);
  else if(k==='x+') c.ox=+(c.ox+0.02).toFixed(2);
  else if(k==='x-') c.ox=+(c.ox-0.02).toFixed(2);
  else if(k==='y+') c.oy=+(c.oy+0.02).toFixed(2);
  else if(k==='y-') c.oy=+(c.oy-0.02).toFixed(2);
  else if(k==='r') c.rot=(c.rot+90)%360;
  applyCal(); renderStep(); }; });
document.getElementById('cal-copy').onclick=()=>{ const msg=document.getElementById('cal-msg');
  if(!cur){ msg.textContent='シナリオ未選択'; return; } const f=curFace(); const c=f.calib;
  const txt=`${cur.name}${isMultiFace()?('/'+f.label):''}: scale=${c.scale} ox=${c.ox} oy=${c.oy} rot=${c.rot}`;
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>{msg.textContent='コピー: '+txt;},()=>{msg.textContent=txt;});
  else msg.textContent=txt; };
</script>
