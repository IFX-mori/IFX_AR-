<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>シナリオかんたん作成（試作）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body, button, input, select, textarea, label { touch-action:manipulation; }
  html, body { height:100%; font-family:-apple-system,'Hiragino Sans','Yu Gothic UI','Meiryo UI',sans-serif; background:#f1f5f9; color:#1e293b; }
  button { font-family:inherit; cursor:pointer; }
  input, select, textarea { font-family:inherit; font-size:15px; }
  header { position:sticky; top:0; z-index:20; display:flex; gap:8px; align-items:center; padding:10px 14px; background:#fff; border-bottom:1px solid #e2e8f0; flex-wrap:wrap; }
  header h1 { font-size:16px; font-weight:800; color:#1e3a5f; margin-right:auto; }
  header h1 small { font-size:11px; font-weight:600; color:#94a3b8; margin-left:6px; }
  .hb { padding:8px 12px; border-radius:9px; border:1px solid #cbd5e1; background:#fff; font-size:13px; font-weight:700; color:#334155; }
  .hb.p { background:#1d4ed8; border-color:#1d4ed8; color:#fff; }
  #tabs { display:none; gap:6px; padding:8px 14px 0; }
  #tabs button { flex:1; padding:9px; border-radius:9px; border:1px solid #cbd5e1; background:#fff; font-weight:800; font-size:14px; color:#475569; }
  #tabs button.on { background:#0f172a; color:#fff; border-color:#0f172a; }
  main { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; padding:14px; align-items:start; }
  @media (max-width:900px){ main { grid-template-columns:minmax(0,1fr); } #tabs { display:flex; } main.t-list #pane-flow, main.t-flow #pane-list { display:none; } }
  .pane-h { font-size:13px; font-weight:800; color:#475569; margin:2px 2px 8px; display:flex; align-items:center; gap:8px; }
  #info { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:10px 12px; margin-bottom:10px; display:grid; grid-template-columns:auto minmax(0,1fr); gap:6px 10px; align-items:center; font-size:13px; }
  #info input { padding:7px 9px; border:1px solid #cbd5e1; border-radius:8px; width:100%; }
  #hintbar { display:none; background:#eff6ff; border:1px solid #bfdbfe; color:#1e40af; border-radius:10px; padding:9px 12px; font-size:13px; line-height:1.6; margin-bottom:10px; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:9px 10px; margin-bottom:8px; }
  .card.sel { border-color:#1d4ed8; box-shadow:0 0 0 2px #bfdbfe; }
  .row { display:flex; gap:6px; align-items:center; }
  .no { flex:0 0 auto; min-width:28px; height:28px; padding:0 6px; border-radius:999px; background:#e2e8f0; color:#334155; font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center; }
  .card input.t, .sub input.t { flex:1; min-width:0; padding:8px 10px; border:1px solid #cbd5e1; border-radius:8px; font-weight:700; }
  .det { display:flex; gap:6px; margin-top:6px; padding-left:34px; }
  .det textarea { flex:1; min-height:38px; padding:7px 9px; border:1px solid #cbd5e1; border-radius:8px; font-size:13px; resize:vertical; }
  .det select { padding:6px; border:1px solid #cbd5e1; border-radius:8px; font-size:13px; align-self:flex-start; }
  .acts { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; padding-left:34px; }
  .ab { padding:7px 11px; border-radius:9px; border:1px solid #cbd5e1; background:#fff; font-size:13px; font-weight:700; color:#334155; }
  .ab.add { border-color:#1d4ed8; color:#1d4ed8; }
  .ab.br { border-color:#d97706; color:#b45309; background:#fffbeb; }
  .ab.del { border-color:#fecaca; color:#dc2626; }
  .ab.sm { padding:5px 9px; font-size:12px; }
  .card.branch { background:#fffbeb; border-color:#fcd34d; }
  .card.branch.sel { border-color:#d97706; box-shadow:0 0 0 2px #fde68a; }
  .bh { font-size:13px; font-weight:800; color:#92400e; display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .bh .sp { margin-left:auto; }
  .q { width:100%; padding:8px 10px; border:1px solid #fbbf24; border-radius:8px; font-weight:700; margin-bottom:8px; background:#fff; }
  .ans { background:#fff; border:1px solid #fde68a; border-left:5px solid #1d4ed8; border-radius:10px; padding:8px; margin-bottom:8px; }
  .ans.warn { border-left-color:#d97706; } .ans.danger { border-left-color:#dc2626; }
  .ans .lbl { font-size:12px; font-weight:800; color:#64748b; white-space:nowrap; }
  .ans input.al { flex:1; min-width:0; padding:7px 9px; border:1px solid #cbd5e1; border-radius:8px; font-weight:700; }
  .ans select { padding:6px; border:1px solid #cbd5e1; border-radius:8px; font-size:13px; }
  .sub { margin:6px 0 0 14px; padding-left:10px; border-left:2px dashed #cbd5e1; }
  .sub .row { margin-bottom:6px; }
  .sub .no { background:#ccfbf1; color:#0f766e; }
  .then { margin-top:8px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:13px; color:#475569; }
  .then input { padding:6px 8px; border:1px solid #cbd5e1; border-radius:8px; font-size:13px; flex:1; min-width:140px; }
  .ic { width:30px; height:30px; border-radius:8px; border:1px solid #cbd5e1; background:#fff; font-weight:800; color:#64748b; flex:0 0 auto; }
  .empty { text-align:center; color:#64748b; font-size:14px; padding:30px 10px; background:#fff; border:1px dashed #cbd5e1; border-radius:12px; }
  #pane-flow { position:sticky; top:66px; }
  #svgwrap { background:#fff; border:1px solid #e2e8f0; border-radius:12px; overflow:auto; max-height:62vh; }
  #svgwrap svg { display:block; margin:0 auto; } #svgwrap .fn { cursor:pointer; }
  #checks { margin-top:8px; font-size:13px; line-height:1.7; }
  #checks .e { color:#b91c1c; cursor:pointer; } #checks .w { color:#b45309; cursor:pointer; } #checks .ok { color:#15803d; font-weight:800; }
  #routes { margin-top:6px; font-size:12px; color:#475569; line-height:1.7; }
  .modal { position:fixed; inset:0; z-index:50; background:rgba(15,23,42,.55); display:none; align-items:center; justify-content:center; padding:16px; }
  .modal.on { display:flex; }
  .modal .box { background:#fff; border-radius:16px; padding:18px; width:100%; max-width:560px; max-height:88vh; overflow:auto; }
  .modal h3 { font-size:17px; font-weight:800; margin-bottom:6px; color:#0f172a; }
  .modal p.s { font-size:13px; color:#475569; line-height:1.7; margin-bottom:10px; }
  .modal input[type=text], .modal textarea { width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:10px; margin-bottom:10px; }
  .modal textarea { min-height:170px; line-height:1.7; }
  .mact { display:flex; gap:8px; justify-content:flex-end; margin-top:6px; flex-wrap:wrap; }
  .wzdots { display:flex; gap:6px; margin-bottom:10px; } .wzdots i { width:26px; height:5px; border-radius:3px; background:#e2e8f0; } .wzdots i.on { background:#1d4ed8; }
  .bigq { display:flex; gap:10px; margin:8px 0 4px; } .bigq button { flex:1; padding:16px; border-radius:12px; font-size:16px; font-weight:800; border:2px solid #cbd5e1; background:#fff; }
  .tpl { display:block; width:100%; text-align:left; padding:12px; border:1px solid #e2e8f0; border-radius:12px; background:#f8fafc; margin-bottom:8px; }
  .tpl b { display:block; font-size:15px; color:#0f172a; margin-bottom:3px; } .tpl span { font-size:12.5px; color:#475569; line-height:1.6; }
  .tpl:active { background:#e0e7ff; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#0f172a; color:#fff; padding:10px 16px; border-radius:10px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:90; }
</style>
</head>
<body>
<header>
  <h1>シナリオかんたん作成<small>試作 v0.1</small></h1>
  <button class="hb" onclick="openWizard()">＋ 新しく作る</button>
  <button class="hb" onclick="loadSample()">サンプル</button>
  <button class="hb p" onclick="openExport()">📤 出力</button>
</header>
<div id="tabs"><button id="tab-list" class="on" onclick="setTab('list')">手順</button><button id="tab-flow" onclick="setTab('flow')">フロー図</button></div>
<main id="main" class="t-list">
  <section id="pane-list">
    <div id="info">
      <label for="in-name">シナリオ名</label><input id="in-name" placeholder="例：〇〇盤 定期点検">
      <label for="in-dev">機器名</label><input id="in-dev" placeholder="例：〇〇盤（任意）">
    </div>
    <div id="hintbar"></div>
    <div class="pane-h">手順<span style="font-weight:600;color:#94a3b8">（手順を押すと「＋次の手順」「🔀 ここで分かれる」が出ます）</span></div>
    <div id="list"></div>
  </section>
  <section id="pane-flow">
    <div class="pane-h">フロー図<span style="font-weight:600;color:#94a3b8">（自動で描きます。押すとその手順へ移動）</span></div>
    <div id="svgwrap"></div>
    <div id="checks"></div>
    <div id="routes"></div>
  </section>
</main>

<!-- はじめの対話 -->
<div class="modal" id="wz"><div class="box">
  <div class="wzdots"><i></i><i></i><i></i></div>
  <div id="wz-body"></div>
</div></div>
<!-- ひな形 -->
<div class="modal" id="tplm"><div class="box">
  <h3>よく使う分かれ方から選ぶ</h3>
  <p class="s">選んだ手順のすぐ後に入ります。文字はあとで自由に書き換えられます。</p>
  <div id="tpl-list"></div>
  <div class="mact"><button class="hb" onclick="closeM('tplm')">閉じる</button></div>
</div></div>
<!-- 出力 -->
<div class="modal" id="exp"><div class="box">
  <h3>📤 シナリオJSONを出力</h3>
  <p class="s">下の内容をコピーし、エディタの「📋 JSONを貼り付けて読込」に貼り付けると、写真・AR位置の調整と保存に進めます。</p>
  <div id="exp-warn" style="font-size:13px;color:#b91c1c;margin-bottom:8px"></div>
  <textarea id="exp-ta" style="min-height:240px;font-family:ui-monospace,monospace;font-size:11.5px" readonly></textarea>
  <div class="mact"><button class="hb" onclick="closeM('exp')">閉じる</button><button class="hb p" onclick="copyExport()">📋 コピー</button></div>
</div></div>
<div id="toast"></div>

<script>
// ══════ データ ══════
// items：本流の並び。{type:'step',id,title,detail,warn} / {type:'branch',id,q,answers:[{id,label,tone,steps:[{id,title,detail,warn}],then:'next'|'jump'|'back'|'end',target,endLabel}]}
const KEY='sb_proto_draft';
let S={ name:'', device:'', items:[], sel:null };
const uid=()=>Math.random().toString(36).slice(2,9);
const escHtml=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){ const e=document.getElementById('toast'); e.textContent=t; e.style.opacity=1; clearTimeout(e._t); e._t=setTimeout(()=>e.style.opacity=0,2400); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(_){} }
function mkStep(title){ return { type:'step', id:uid(), title:title||'', detail:'', warn:'normal' }; }
function mkSub(title){ return { id:uid(), title:title||'', detail:'', warn:'normal' }; }
function mkAns(label,tone){ return { id:uid(), label:label||'', tone:tone||'', steps:[], then:'next', target:'', endLabel:'' }; }
function findItem(id){ return S.items.find(x=>x.id===id); }
function idxOf(id){ return S.items.findIndex(x=>x.id===id); }
function mainNo(){ const m={}; let n=0; S.items.forEach(it=>{ if(it.type==='step') m[it.id]=++n; }); return m; }
function stepsBefore(i){ return S.items.slice(0,i).filter(x=>x.type==='step'); }
function stepsAfter(i){ return S.items.slice(i+1).filter(x=>x.type==='step'); }

// ══════ 手順リストの描画 ══════
function render(){
  document.getElementById('in-name').value=S.name; document.getElementById('in-dev').value=S.device;
  const L=document.getElementById('list'), no=mainNo();
  if(!S.items.length){ L.innerHTML=`<div class="empty">まだ手順がありません<br><br><button class="ab add" data-act="first">＋ 最初の手順を書く</button></div>`; renderFlow(); return; }
  L.innerHTML=S.items.map((it,i)=> it.type==='step' ? stepCard(it,no[it.id],i) : branchCard(it,i,no)).join('');
  renderFlow(); save();
}
function warnSel(v,attrs){ return `<select ${attrs} title="注意レベル"><option value="normal"${v==='normal'?' selected':''}>通常</option><option value="caution"${v==='caution'?' selected':''}>注意⚠️</option><option value="danger"${v==='danger'?' selected':''}>危険⛔</option></select>`; }
function stepCard(it,n,i){ const sel=S.sel===it.id;
  return `<div class="card${sel?' sel':''}" id="it-${it.id}" data-id="${it.id}">
    <div class="row"><span class="no">${n}</span><input class="t" data-k="title" value="${escHtml(it.title)}" placeholder="手順の内容（例：電源ランプを確認）"></div>
    ${sel?`<div class="det"><textarea data-k="detail" placeholder="作業者への説明（任意）">${escHtml(it.detail)}</textarea>${warnSel(it.warn,'data-k="warn"')}</div>
    <div class="acts"><button class="ab add" data-act="addAfter">＋ 次の手順</button><button class="ab br" data-act="branch">🔀 ここで分かれる</button><button class="ab br" data-act="tpl">🔀 よく使う分かれ方</button>
      <button class="ab sm" data-act="up" title="上へ">↑</button><button class="ab sm" data-act="down" title="下へ">↓</button><button class="ab sm del" data-act="del">削除</button></div>`:''}
  </div>`; }
function branchCard(b,i,no){ const sel=S.sel===b.id, before=stepsBefore(i), after=stepsAfter(i);
  const nextTxt = after.length ? `次の手順へ進む（手順${no[after[0].id]}）` : '次の手順へ進む（この後に手順が無いので作業終了）';
  const ans=b.answers.map((a,ai)=>{
    const tgtList = a.then==='jump'?after.slice(1):a.then==='back'?before:[];
    const tsel = (a.then==='jump'||a.then==='back') ? `<select data-ans="${a.id}" data-k="target"><option value="">（手順を選ぶ）</option>${tgtList.map(s=>`<option value="${s.id}"${s.id===a.target?' selected':''}>手順${no[s.id]} ${escHtml(s.title||'（未入力）')}</option>`).join('')}</select>` : '';
    return `<div class="ans ${a.tone||''}">
      <div class="row"><span class="lbl">答え${ai+1}</span><input class="al" data-ans="${a.id}" data-k="label" value="${escHtml(a.label)}" placeholder="例：異常あり">
        <select data-ans="${a.id}" data-k="tone" title="ボタンの色"><option value=""${!a.tone?' selected':''}>青</option><option value="warn"${a.tone==='warn'?' selected':''}>黄</option><option value="danger"${a.tone==='danger'?' selected':''}>赤</option></select>
        ${b.answers.length>2?`<button class="ic" data-act="ansDel" data-ans="${a.id}" title="この答えを削除">✕</button>`:''}</div>
      ${a.steps.length?`<div class="sub">${a.steps.map((s,si)=>`<div class="row"><span class="no">${escHtml((a.label||'答え'+(ai+1)).slice(0,4))}-${si+1}</span><input class="t" data-ans="${a.id}" data-sub="${s.id}" data-k="title" value="${escHtml(s.title)}" placeholder="この答えのときの手順"><button class="ic" data-act="subDel" data-ans="${a.id}" data-sub="${s.id}" title="削除">✕</button></div>`).join('')}</div>`:''}
      <div class="then">${a.steps.length?`<button class="ab sm add" data-act="subAdd" data-ans="${a.id}">＋ 手順を追加</button>`:`<button class="ab sm add" data-act="subAdd" data-ans="${a.id}">＋ この答えのときの手順を書く</button>`}</div>
      <div class="then"><b>${a.steps.length?'その後：':'選んだら：'}</b>
        <select data-ans="${a.id}" data-k="then"><option value="next"${a.then==='next'?' selected':''}>${nextTxt}</option>
          ${after.length>1?`<option value="jump"${a.then==='jump'?' selected':''}>後の手順へ飛ぶ</option>`:''}
          ${before.length?`<option value="back"${a.then==='back'?' selected':''}>前の手順に戻る（やり直し）</option>`:''}
          <option value="end"${a.then==='end'?' selected':''}>作業終了</option></select>
        ${tsel}${a.then==='end'?`<input data-ans="${a.id}" data-k="endLabel" value="${escHtml(a.endLabel)}" placeholder="終了の名前（任意）例：作業中止・指令へ連絡">`:''}</div>
    </div>`; }).join('');
  return `<div class="card branch${sel?' sel':''}" id="it-${b.id}" data-id="${b.id}">
    <div class="bh">🔀 分かれ目<span class="sp"></span><button class="ab sm del" data-act="del">分かれ目を削除</button></div>
    <input class="q" data-k="q" value="${escHtml(b.q)}" placeholder="何を確認しますか？（例：異常はありましたか？）">
    ${ans}
    ${b.answers.length<4?`<button class="ab sm" data-act="ansAdd">＋ 答えを追加</button>`:''}
  </div>`; }

// ══════ 操作 ══════
const L=document.getElementById('list');
function target(e){ const card=e.target.closest('[data-id]'); const it=card&&findItem(card.dataset.id); return {card,it}; }
L.addEventListener('input',e=>{ const {it}=target(e); if(!it) return; const el=e.target, k=el.dataset.k; if(!k) return;
  let o=it; if(el.dataset.ans){ o=it.answers.find(a=>a.id===el.dataset.ans); if(el.dataset.sub) o=o.steps.find(s=>s.id===el.dataset.sub); }
  o[k]=el.value; if(el.tagName==='SELECT') rerenderKeep(el); else { scheduleFlow(); save(); } });
L.addEventListener('focusin',e=>{ const t=e.target.tagName; if(t!=='INPUT'&&t!=='TEXTAREA') return;   // ボタン・選択欄はクリック側で処理（描き直しで押下が消えないように）
  const {it}=target(e); if(it && S.sel!==it.id){ S.sel=it.id; rerenderKeep(e.target); } });
L.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); const {it}=target(e);
  if(!b){ if(it&&S.sel!==it.id){ S.sel=it.id; render(); } return; }
  const act=b.dataset.act, i=it?idxOf(it.id):-1;
  if(act==='first'){ const s=mkStep(); S.items.push(s); S.sel=s.id; render(); focusItem(s.id); return; }
  if(act==='addAfter'){ const s=mkStep(); S.items.splice(i+1,0,s); S.sel=s.id; render(); focusItem(s.id); return; }
  if(act==='branch'){ insertBranch(i, { q:'', answers:[mkAns(''),mkAns('')] }); return; }
  if(act==='tpl'){ openTpl(i); return; }
  if(act==='up'||act==='down'){ const j=i+(act==='up'?-1:1); if(j<0||j>=S.items.length) return; [S.items[i],S.items[j]]=[S.items[j],S.items[i]]; fixBranches(); render(); return; }
  if(act==='del'){ if(it.type==='step' && !confirm(`手順「${it.title||'（未入力）'}」を削除しますか？`)) return;
    if(it.type==='branch' && !confirm('この分かれ目を削除しますか？（答えのときの手順も消えます）')) return;
    S.items.splice(i,1); S.sel=null; fixBranches(); render(); return; }
  const a=it&&it.answers&&it.answers.find(x=>x.id===b.dataset.ans);
  if(act==='ansAdd'){ if(it.answers.length<4){ const n=mkAns(''); it.answers.push(n); render(); focusSel(`[data-ans="${n.id}"][data-k="label"]`); } return; }
  if(act==='ansDel'){ it.answers=it.answers.filter(x=>x!==a); render(); return; }
  if(act==='subAdd'){ const s=mkSub(); a.steps.push(s); render(); focusSel(`[data-sub="${s.id}"]`); return; }
  if(act==='subDel'){ a.steps=a.steps.filter(x=>x.id!==b.dataset.sub); render(); return; }
});
// Enterで次の手順を追加（本流の手順・答えの手順）
L.addEventListener('keydown',e=>{ if(e.key!=='Enter'||e.isComposing||e.target.tagName!=='INPUT'||e.target.dataset.k!=='title') return;
  e.preventDefault(); const {it}=target(e); if(!it) return;
  if(e.target.dataset.sub){ const a=it.answers.find(x=>x.id===e.target.dataset.ans); const k=a.steps.findIndex(x=>x.id===e.target.dataset.sub); const s=mkSub(); a.steps.splice(k+1,0,s); render(); focusSel(`[data-sub="${s.id}"]`); }
  else if(it.type==='step'){ const s=mkStep(); S.items.splice(idxOf(it.id)+1,0,s); S.sel=s.id; render(); focusItem(s.id); } });
document.getElementById('in-name').oninput=e=>{ S.name=e.target.value; save(); };
document.getElementById('in-dev').oninput=e=>{ S.device=e.target.value; save(); };
function insertBranch(i,b){ const br={ type:'branch', id:uid(), q:b.q, answers:b.answers };
  S.items.splice(i+1,0,br); S.sel=br.id; fixBranches(); render(); document.getElementById('it-'+br.id).scrollIntoView({block:'nearest',behavior:'smooth'});
  if(!b.q) focusSel(`#it-${br.id} .q`); hint(''); }
// 移動・削除で行き先が無効になったら「次の手順へ」に戻す

// ══════ 区間(flow)へ変換：本流を分かれ目・飛び先で区切り、答えの手順は分岐側の区間にする ══════

        a.steps.forEach(st=>steps.push({ sec:as.key, title:st.title||'（未入力）', detail:st.detail||'', warn:(st.warn&&st.warn!=='normal')?st.warn:(a.tone==='danger'?'danger':a.tone==='warn'?'caution':'normal') }));

        to=as.key; }

}

// ══════ 解析とフロー図（エディタ v4.23 と同じ考え方） ══════

    else if(nx.type==='choice') (nx.options||[]).forEach(o=>edges.push({from:s.key,to:o.to||'',kind:'choice',label:o.label||'',tone:o.tone||''}));
    else { const lb=(nx.label||'').trim()||'終了'; const ek='END:'+lb; ends.set(ek,lb); edges.push({from:s.key,to:ek,kind:'end',label:''}); } });

  P.e.forEach(x=>h+=`<div class="e" data-go="${x.id||''}">✕ ${escHtml(x.m)}</div>`); P.w.forEach(x=>h+=`<div class="w" data-go="${x.id||''}">⚠ ${escHtml(x.m)}</div>`);
  chk.innerHTML=h; chk.querySelectorAll('[data-go]').forEach(d=>d.onclick=()=>{ const id=d.dataset.go; if(!id) return; S.sel=id; setTab('list'); render(); const el=document.getElementById('it-'+id); if(el) el.scrollIntoView({block:'center',behavior:'smooth'}); });
  rt.innerHTML = A.routes.length>1 ? '<b>流れの種類</b><br>'+A.routes.map((r,i)=>`${i+1}. ${r.path.map(k=>escHtml(A.by.get(k).label)).join(' → ')} → ${escHtml(r.end)}（${r.steps}手順）`).join('<br>') : '';
}
// 書き手に分かる言葉での問題点
function problems(A){ const e=[], w=[], no=mainNo();
  S.items.forEach((it,i)=>{
    if(it.type==='step' && !it.title.trim()) w.push({id:it.id, m:`手順${no[it.id]}の内容が空欄です`});
    if(it.type!=='branch') return;
    if(i===0) e.push({id:it.id, m:'最初の手順より前に分かれ目があります（分かれ目は手順の後に置きます）'});
    if(!it.q.trim()) w.push({id:it.id, m:'分かれ目の質問が空欄です'});
    if(it.answers.length<2) e.push({id:it.id, m:'分かれ目の答えが2つ未満です'});
    it.answers.forEach((a,ai)=>{ const n=`「${it.q||'分かれ目'}」の答え${ai+1}`;
      if(!a.label.trim()) e.push({id:it.id, m:`${n}が空欄です`});
      if((a.then==='jump'||a.then==='back')&&!a.target) e.push({id:it.id, m:`${n}の行き先の手順を選んでください`});
      a.steps.forEach((s,si)=>{ if(!s.title.trim()) w.push({id:it.id, m:`${n}の手順${si+1}が空欄です`}); }); });
  });
  A.by.forEach((s,k)=>{ if(!A.canEnd.has(k)){ const id=_conv.firstItem[k]; e.push({id, m:`「${s.label}」から作業終了にたどり着けません（やり直しがループしています）`}); } });
  return { e, w }; }
function setTab(t){ document.getElementById('main').className='t-'+t; document.getElementById('tab-list').classList.toggle('on',t==='list'); document.getElementById('tab-flow').classList.toggle('on',t==='flow'); if(t==='flow') renderFlow(); }

// ══════ 出力（エディタの「JSONを貼り付けて読込」用） ══════
function buildJSON(){ const c=toFlow(); const hasBranch=S.items.some(x=>x.type==='branch');
  const steps=c.steps.map(s=>({ ...(hasBranch?{sec:s.sec}:{}), title:s.title, detail:s.detail, warn:s.warn, face:'f1', photo:'',
    ar:[{ type:'text', pos:[0,0.16,0], color: s.warn==='danger'?'#ef4444':s.warn==='caution'?'#f59e0b':'#60a5fa', label:s.title.slice(0,16), fontScale:1 }] }));
  const slug=(S.name||'bc').replace(/[^0-9A-Za-z一-龠ぁ-んァ-ヶ]/g,'').slice(0,10)||'bc';
  return JSON.stringify({ id:'bc-'+slug+'-'+Date.now().toString(36).slice(-5), name:S.name||'新規シナリオ', subtitle:'', device:S.device||'', docs:{},
    faces:[{ key:'f1', label:'前面', barcode:null, markerSizeMM:40, calib:{scale:6.6667,ox:0,oy:0,rot:0}, imageFile:'', markerPos:{u:0.5,v:0.5,w:0.15} }],
    ...(hasBranch?{ formatVersion:2, flow:c.flow }:{}), steps }, null, 1); }
function openExport(){ if(!S.items.length){ toast('先に手順を書いてください'); return; }
  const A=analyze(toFlow().flow,toFlow().steps), P=problems(A);
  document.getElementById('exp-warn').textContent = P.e.length ? `✕ 直したほうがよい点が${P.e.length}件あります（フロー図の下を確認）。このまま出力もできます。` : '';
  document.getElementById('exp-ta').value=buildJSON(); document.getElementById('exp').classList.add('on'); }
function copyExport(){ const ta=document.getElementById('exp-ta'); ta.select();
  (navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).then(()=>toast('コピーしました'),()=>{ try{ document.execCommand('copy'); toast('コピーしました'); }catch(_){ toast('選択された内容を手動でコピーしてください'); } }); }

// ══════ 起動 ══════
(function(){ let d=null; try{ d=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(_){}
  if(d&&Array.isArray(d.items)){ S=d; render(); if(!S.items.length) openWizard(); } else { render(); openWizard(); } })();
</script>
